function deltaChips(b, a){
  const items = [
    ["Dette", a.dette - b.dette, v => fmtMd(v), true, 0.05],
    ["Dette/PIB", a.ratio - b.ratio, v => nf1.format(v) + " pt", true, 0.05],
    ["Popularité", a.pop - b.pop, v => nf1.format(v) + " pt", false, 0.05],
    ["Colère", a.col - b.col, v => nf1.format(v) + " pt", true, 0.05],
    ["Assemblée", a.ass - b.ass, v => nf1.format(v) + " pt", false, 0.05]
  ];
  return items.filter(x => Math.abs(x[1]) >= x[4]).map(([l,v,f,upGood]) => {
    const good = upGood ? v > 0 : v < 0;
    return `<span class="chip ${good?"good":"bad"}">${l} ${sgn(v,f)}</span>`;
  }).join("");
}

function ratingAlert(b, a){
  if(a.ri > b.ri) return `<div class="alert g">📉 ${pick(AGENCIES)} dégrade la France : <b>${b.note} → ${a.note}</b>. ${pick(["Les taux d’intérêt grimpent. Bravo.","Bercy pleure, vous souriez.","Le Portugal nous regarde de haut.","La boule de neige grossit."])}</div>`;
  if(a.ri < b.ri) return `<div class="alert">📈 Horreur : la note de la France remonte (${b.note} → ${a.note}). Les marchés reprennent confiance.</div>`;
  return "";
}

function showResult({kicker, title, text, before, after, eco, ev, scene, mood, onContinue}){
  mood = mood || moodFor(before, after);
  openModal(`
    ${scene ? clip(scene[0], Object.assign({mood}, scene[1])) : ""}
    <div class="kicker">${kicker}</div>
    <h3>${title}</h3>
    <div class="react">${faceSVG(S.char, mood, 58)}<div class="bubble">${esc(quip(mood))}</div></div>
    <p class="txt">${text}</p>
    <div class="chips">${deltaChips(before, after) || '<span class="chip bad">Rien n’a bougé. Décevant.</span>'}</div>
    <div class="legend">Vert = bon pour votre mission (faire couler la France). Rouge = la France va mieux, hélas.</div>
    ${ratingAlert(before, after)}
    ${ev ? `<div class="box"><b class="t">Pendant ce temps…</b>${ev.t}${ev.c ? " " + ev.c : ""}</div>` : ""}
    ${eco ? `<div class="box"><b class="t">Le trimestre à Bercy</b>Déficit du trimestre : <b>${fmtMd(eco.deficit)}</b>, dont <b>${fmtMd(eco.interest)}</b> d’intérêts de la dette (taux moyen ${nf1.format(eco.taux)} %).</div>` : ""}
    <div class="btnrow"><button class="btn" id="cont">Continuer →</button></div>`);
  $("#cont").onclick = onContinue;
  $("#cont").focus();
}

function showCensure(done){
  const votes = 289 + Math.floor(rnd(1, 70));
  const old = S.pmName, days = Math.max(14, S.pmDays);
  S.pms++;
  const before = snap();
  applyE({pop:-3, d:4});
  S.ass = 55;
  let next = pick(PM_NAMES.filter(n => n !== old));
  S.pmName = next; S.pmDays = 0;
  addNews(`Censure : le gouvernement de ${old} renversé par ${votes} voix`);
  pushLog(dateOf(S.turn), `Motion de censure : ${old} tombe. ${next} nommé(e) à Matignon.`);
  openModal(`
    ${clip("assembly", {sign:"CENSURE !", caption:`Le gouvernement de ${old} est renversé`})}
    <div class="kicker">🏛️ Assemblée nationale · Remake de décembre 2024</div>
    <div class="react">${faceSVG(S.char, "angry", 58)}<div class="bubble">${esc(quip("angry"))}</div></div>
    <h3>Motion de censure adoptée !</h3>
    <p class="txt">Par <b>${votes} voix</b>, l’Assemblée renverse le gouvernement de <b>${esc(old)}</b>, après ${days} jours de fonctions. C’est le <b>${S.pms}${S.pms===1?"er":"e"} Premier ministre</b> à tomber sous votre mandat. Faute de budget, la France passe en « loi spéciale ».</p>
    <p class="txt">Vous nommez <b>${esc(next)}</b>. ${pick(["Il/elle apprend sa nomination en sortant de la douche.","Le carton de déménagement de son prédécesseur est encore dans le couloir.","Les paris en ligne donnent son départ à 3 contre 1 avant Noël.","La passation de pouvoir dure 4 minutes. Personne n’a retiré son manteau."])}</p>
    <div class="chips">${deltaChips(before, snap())}</div>
    <div class="btnrow"><button class="btn" id="cont">Continuer →</button></div>`);
  $("#cont").onclick = done;
  $("#cont").focus();
}

function showManif(type, done){
  const M = MANIFS[type];
  const title = M.title.replace("{n}", ++S.acte);
  const cgt = Math.round((60000 + S.col * 16000 + rnd(0, 250000)) * M.size / 1000) * 1000;
  const police = Math.round(cgt / rnd(3.2, 5) / 100) * 100;
  const needed = Math.max(1500, Math.round(police / 12 * M.mult / 500) * 500);
  const c = S.char;
  const special = {
    macron:{label:"Lancer un Grand Débat national", sub:"7 heures de monologue devant 600 maires", e:{d:0.3,pop:1,col:-15}, r:"Vous parlez 7 heures sans pause devant 600 maires. Trois se sont évanouis, deux ont démissionné, la manif s’est endormie."},
    melenchon:{label:"Prendre la tête du cortège", sub:"Manifester contre votre propre gouvernement", e:{pop:2,col:15,ass:-10}, r:"Vous manifestez contre votre propre gouvernement, mégaphone à la main. Un concept. La foule double."},
    lepen:{label:"Envoyer Jordan faire un TikTok", sub:"12 millions de vues, 0 solution", e:{pop:-2,col:6}, r:"Il filme une vidéo devant les manifestants avec un filtre chiot. 12 millions de vues, zéro solution, beaucoup de colère."}
  }[c];
  const vacances = {macron:"Vous partez au Touquet.", melenchon:"Vous ne pouvez pas ignorer une manif, c’est contre-nature. Vous y allez en cachette, avec une fausse moustache.", lepen:"Vous partez nourrir vos chats à Saint-Cloud."}[c];
  const look = manifLook(type, {caption:"Le cortège approche"});
  openModal(`
    ${clip(look[0], look[1])}
    <div class="kicker">📢 Manifestation · ${dateOf(S.turn)}</div>
    <h3>${M.icon} ${title}</h3>
    <p class="txt">${M.flavor}</p>
    <div class="crowd">
      <div><div class="tl">Selon les syndicats</div><div class="num">${nf0.format(cgt)}</div></div>
      <div><div class="tl">Selon la police</div><div class="num">${nf0.format(police)}</div></div>
    </div>
    <div class="box"><b class="t">Note du préfet</b>Pour tenir la situation, il recommande environ <b>${nf0.format(needed)} CRS et gendarmes mobiles</b>. Trop peu : ça déborde. Beaucoup trop : ça dérape.</div>
    <div class="slider">
      <div class="row"><span>Forces de l’ordre envoyées</span><span class="crsnum" id="crsN">${nf0.format(needed)}</span></div>
      <input type="range" id="crs" min="0" max="100000" step="500" value="${needed}">
      <div class="row muted"><span id="crsCost"></span><span id="crsRatio"></span></div>
    </div>
    <div class="mopts">
      <button class="primary" data-a="crs"><b>🚓 Envoyer les CRS</b><small>Avec le nombre choisi ci-dessus</small></button>
      <button data-a="cede"><b>🤝 Céder sur tout</b><small>Chèque, recul, prime : ça coûte cher</small></button>
      <button data-a="ignore"><b>🏖️ Ignorer et partir en vacances</b><small>${vacances.split(".")[0]}</small></button>
      <button data-a="special"><b>${special.label}</b><small>${special.sub}</small></button>
    </div>`);
  const sl = $("#crs");
  const upd = () => {
    const v = +sl.value, q = v / needed;
    $("#crsN").textContent = nf0.format(v);
    $("#crsCost").textContent = "Coût : " + fmtMd(v * 0.00005) + " (heures sup, lacrymo, sandwichs)";
    $("#crsRatio").textContent = v === 0 ? "Aucun CRS : bon courage" : q < 0.5 ? "Très insuffisant" : q < 1.4 ? "Dosage « à la française »" : q < 2.5 ? "Surdimensionné" : "Démesuré";
  };
  sl.oninput = upd; upd();
  document.querySelectorAll(".mopts button").forEach(b => b.onclick = () => {
    const a = b.dataset.a, before = snap();
    let r, ttl, e, n;
    if(a === "crs"){
      const v = +sl.value, q = v / needed, cost = v * 0.00005;
      if(v === 0 || q < 0.5){
        const casse = 0.2 + police / 1e6 * 2;
        e = {d:cost + casse, pop:-5, col:10}; ttl = "Débordements !";
        r = pick(["Des casseurs incendient une rotonde, une banque, un fast-food et la trottinette d’un député.","Les vitrines de trois avenues volent en éclats. Le préfet annonce que « la situation est sous contrôle » devant un kiosque en feu.","La manif déborde jusqu’au périphérique. Un manège de la foire du Trône est pris en otage."]) + ` Facture de la casse : ${fmtMd(casse)}.`;
        n = "Débordements en marge de la manifestation : « une journée de chaos »";
      } else if(q < 1.4){
        e = {d:cost, pop:-1, col:-12}; ttl = "Maintien de l’ordre « à la française »";
        r = "Les CRS encadrent le cortège. Quelques lacrymos, quelques merguez, puis tout le monde se disperse vers 18 h pour l’apéro. La colère retombe un peu.";
        n = "Manifestation : le cortège se disperse dans le calme, et vers les terrasses";
      } else if(q < 2.5){
        e = {d:cost, pop:-7, col:4}; ttl = "Surréaction policière";
        r = "Nasse de 6 heures, 400 gardes à vue, dont 380 passants, deux touristes japonais et un pigeon.";
        if(Math.random() < 0.4){ e.pop -= 4; e.col += 8; r += " Une vidéo d’une interpellation musclée devient virale : le Défenseur des droits s’en mêle."; }
        n = "Maintien de l’ordre : la nasse géante fait polémique";
      } else {
        e = {d:cost, pop:-10, col:8}; ttl = "Démonstration de force absurde";
        r = `Il y a ${nf1.format(v/police)} CRS par manifestant. Désœuvrés, les CRS finissent par manifester eux-mêmes pour leurs heures supplémentaires.`;
        n = "Plus de CRS que de manifestants : « on se croirait à un défilé militaire »";
      }
      r += ` Coût de l’opération : ${fmtMd(cost)}.`;
    } else if(a === "cede"){
      const cost = M.demand * rnd(0.8, 1.3);
      e = {d:cost, def:M.demand/16, pop:5, col:-25}; ttl = "Vous cédez sur tout";
      r = `Les manifestants obtiennent tout. Les syndicats, pris de court, n’avaient pas prévu de victoire et doivent improviser un communiqué. Facture : ${fmtMd(cost)}, plus des dépenses permanentes.`;
      n = "Le gouvernement cède : « une victoire historique », reconnaissent les syndicats, surpris";
    } else if(a === "ignore"){
      e = {pop:-4, col:12}; ttl = "Vous ignorez la rue";
      r = vacances + " Les manifestants l’apprennent par les journaux. La colère monte d’un cran.";
      n = "Pendant la manifestation, le chef de l’État en vacances : polémique";
    } else {
      e = special.e; ttl = special.label; r = special.r; n = special.label + " : la séquence fait réagir";
    }
    applyE(e);
    addNews(n);
    pushLog(dateOf(S.turn), title + " → " + ttl);
    let sc;
    if(a === "crs") sc = ttl.startsWith("Maintien") ? (look[0] === "road" ? [look[0], Object.assign({}, look[1], {caption:n})] : ["march", Object.assign({}, look[1], {calm:true, caption:n})]) : ["riot", {caption:n}];
    else if(a === "cede") sc = ["party", {sign:"VICTOIRE !", caption:n}];
    else if(a === "ignore") sc = ["beach", {place:BEACH_PLACE[c], caption:n}];
    else sc = {macron:["tv",{caption:"Grand Débat national : 7 heures de monologue"}], melenchon:["march",{sign:"LE TRIBUN EST LÀ !", balloon:"RÉVOLUTION !", caption:n}], lepen:["tv",{caption:"Jordan en direct sur TikTok devant la manif"}]}[c];
    showResult({kicker:"Manifestation · issue", title:ttl, text:r, before, after:snap(), scene:sc, onContinue:done});
  });
}

/* ---------------------------------------------------------------------
   Toasts
   --------------------------------------------------------------------- */
function toast(t){
  const d = document.createElement("div"); d.className = "toast"; d.textContent = t;
  $("#toasts").appendChild(d); setTimeout(() => d.remove(), 4200);
}

/* ---------------------------------------------------------------------
   Fin de partie
   --------------------------------------------------------------------- */
function computeScore(type){
  let s = (S.dette - DETTE0) + Math.max(0, 50 - S.pop) * 20 + S.col * 3 + S.pms * 80;
  if(type === "win") s += 1500 + (TURNS - S.turn) * 100;
  if(type === "revolution") s += 600;
  if(type === "adored" || type === "austerity") s *= 0.4;
  return Math.max(0, Math.round(s));
}

function chartSVG(values, {min, max, target, color, label, unit}){
  const W = 320, H = 150, pl = 34, pr = 10, pt = 14, pb = 22;
  const lo = Math.min(min, ...values), hi = Math.max(max, ...values);
  const x = i => pl + i * (W - pl - pr) / Math.max(1, values.length - 1);
  const y = v => pt + (1 - (v - lo) / (hi - lo || 1)) * (H - pt - pb);
  const pts = values.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const ticks = [lo, (lo+hi)/2, hi];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">
    ${ticks.map(t => `<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-5}" y="${y(t)+3}" font-size="9" text-anchor="end" fill="var(--muted)">${nf0.format(t)}${unit}</text>`).join("")}
    ${target != null && target >= lo && target <= hi ? `<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W-pr}" y="${y(target)-4}" font-size="9" text-anchor="end" fill="var(--gold)" font-weight="700">objectif ${target}${unit}</text>` : ""}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(values.length-1)}" cy="${y(values[values.length-1])}" r="4" fill="${color}"/>
    <text x="${pl}" y="${H-6}" font-size="9" fill="var(--muted)">Été 2027</text>
    <text x="${W-pr}" y="${H-6}" font-size="9" text-anchor="end" fill="var(--muted)">${dateOf(Math.min(S.turn, TURNS-1))}</text>
  </svg>`;
}

function endGame(type){
  S.over = true; S.busy = true;
  closeModal();
  $("#ticker").style.display = "none";
  const c = CHARS[S.char], r = ratio();
  let head, story, emoji;
  if(type === "win"){ emoji = "🎉"; head = "La France a coulé !"; story = c.win; }
  else if(type === "revolution"){ emoji = "🔥"; head = "Révolution !"; story = `Les Français prennent l’Élysée, armés de trottinettes, de baguettes rassises et de gilets jaunes. Vous fuyez par les jardins, déguisé${ag("","e")} en jardinier. Une VIIe République est proclamée sur un rond-point de Seine-et-Marne. La dette, elle, est toujours là : ${nf0.format(r)} % du PIB.`; }
  else if(type === "adored"){ emoji = "😱"; head = "Défaite : on vous aime"; story = `Catastrophe. Votre popularité atteint ${nf0.format(S.pop)} %. Les Français vous adorent, ils réclament un mandat de plus, les marchés sont rassurés. La France va bien. Vous avez lamentablement échoué dans votre mission.`; }
  else if(type === "austerity"){ emoji = "😱"; head = "Défaite : finances assainies"; story = "La dette repasse sous les 100 % du PIB. Bruxelles vous décerne la médaille d’or de l’austérité, Berlin vous applaudit debout. Berlin ! Vous avez déshonoré votre mission."; }
  else {
    if(r >= 170 && S.pop <= 28){ emoji = "🥈"; head = "Presque coulée"; story = `Fin du quinquennat. La France est à ${nf0.format(r)} % de dette, votre popularité à ${nf0.format(S.pop)} %. Le FMI a réservé un hôtel à Paris « au cas où ». Encore un effort et c’était le naufrage.`; }
    else if(r >= 145){ emoji = "🛟"; head = "La France prend l’eau"; story = `Fin du quinquennat. ${nf0.format(r)} % de dette, ${nf0.format(S.pop)} % de popularité. Le navire gîte dangereusement, mais il flotte encore. Votre successeur héritera d’une belle ardoise.`; }
    else { emoji = "⛵"; head = "La France flotte encore"; story = `Fin du quinquennat. Avec ${nf0.format(r)} % de dette et ${nf0.format(S.pop)} % de popularité, la France s’en sort à peu près. Un mandat d’une triste normalité.`; }
  }
  const score = computeScore(type);
  const rank = RANKS.filter(x => score >= x[0]).pop();
  const best = loadPref("best", {});
  const isBest = !best[S.char] || score > best[S.char];
  if(isBest){ best[S.char] = score; savePref("best", best); }
  const endScene = {
    win:["sinking",{mood:"happy", caption:"La France a coulé. Le FMI arrive en canot de sauvetage.", label:"FLASH SPÉCIAL"}],
    revolution:["revolution",{caption:"L’Élysée est pris d’assaut", label:"FLASH SPÉCIAL"}],
    adored:["party",{mood:"panic", sign:"ON T’AIME !", caption:"Les Français vous adorent. Échec total."}],
    austerity:["office",{mood:"panic", caption:"La dette baisse. Bruxelles applaudit. Quelle honte."}]
  }[type] || (head === "Presque coulée" ? ["sinking",{mood:"smug", caption:"Le navire coule… mais trop tard pour vous"}] : ["sea",{caption:head}]);
  $("#app").innerHTML = `
  <div class="stripe"></div>
  <main class="wrap">
    <section class="endhero">
      ${clip(endScene[0], endScene[1])}
      <div class="kicker">${c.name} · ${dateOf(Math.min(S.turn, TURNS-1))} · fin de partie</div>
      <h1>${emoji} ${head}</h1>
      <p class="story">${story}</p>
      <div class="score"><div class="tl">Score de naufrage</div><div class="num">${nf0.format(score)}</div><div class="rank">${rank[1]}</div><div class="muted">${rank[2]}</div>${isBest?`<div class="ok" style="margin-top:6px">🏆 Nouveau record pour ${c.name} !</div>`:`<div class="muted" style="margin-top:6px">Record : ${nf0.format(best[S.char])}</div>`}</div>
    </section>
    <section class="endstats">
      <div class="tile"><div class="tl">Dette finale</div><div class="num">${fmtMd(S.dette)}</div><div class="sub">${nf1.format(r)} % du PIB · ${sgn(S.dette-DETTE0,fmtMd)}</div></div>
      <div class="tile"><div class="tl">Popularité finale</div><div class="num">${nf0.format(S.pop)} %</div><div class="sub">Départ : ${c.pop} %</div></div>
      <div class="tile"><div class="tl">Note finale</div><div class="num">${note()}</div><div class="sub">Taux moyen ${nf1.format(taux())} %</div></div>
      <div class="tile"><div class="tl">Premiers ministres tombés</div><div class="num">${S.pms}</div><div class="sub">Colère finale : ${nf0.format(S.col)} %</div></div>
    </section>
    <section class="charts">
      <div class="panel"><h4>Dette / PIB (%)</h4>${chartSVG(S.hist.map(h=>h.ratio),{min:100,max:WIN_RATIO+10,target:WIN_RATIO,color:"var(--red)",label:"Évolution de la dette rapportée au PIB",unit:" %"})}</div>
      <div class="panel"><h4>Popularité (%)</h4>${chartSVG(S.hist.map(h=>h.pop),{min:0,max:70,target:WIN_POP,color:"var(--blue)",label:"Évolution de la popularité",unit:" %"})}</div>
    </section>
    <section class="panel" style="margin-top:14px">
      <h4>Le mandat en bref</h4>
      <ul class="log" style="max-height:none">${S.log.map(l=>`<li><b>${l.d}</b>${esc(l.t)}</li>`).join("")}</ul>
    </section>
    <div class="btnrow" style="justify-content:center;margin:22px 0">
      <button class="btn red" id="again">Rejouer avec ${c.name}</button>
      <button class="btn alt" id="other">Changer de personnage</button>
      <a class="don" href="${DON_URL}" target="_blank" rel="noopener">☕ ${type === "win" ? "La France a coulé, pas le développeur : soutenez-le" : "Soutenir le jeu (prix libre)"}</a>
    </div>
  </main>`;
  const key = S.char;
  $("#again").onclick = () => newGame(key);
  $("#other").onclick = renderSelect;
  window.scrollTo({top:0});
}

/* ---------------------------------------------------------------------
   Préférences locales (facultatives)
   --------------------------------------------------------------------- */
function loadPref(k, def){ try{ const v = localStorage.getItem("naufrage_" + k); return v == null ? def : JSON.parse(v); }catch(e){ return def; } }
function savePref(k, v){ try{ localStorage.setItem("naufrage_" + k, JSON.stringify(v)); }catch(e){} }

/* ---------------------------------------------------------------------
   Compteur de dette en direct + clavier
   --------------------------------------------------------------------- */
let lastT = performance.now();
function tick(t){
  const dt = Math.min(0.25, (t - lastT) / 1000); lastT = t;
  if(S && !S.over){
    S.dette += deficitYear() / 31536000 * dt;   // Md€ par seconde réelle
    const el = document.getElementById("detteLive");
    if(el) el.textContent = fmtEur(S.dette);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

document.addEventListener("keydown", ev => {
  if(!S || S.over) return;
  const open = !$("#overlay").classList.contains("hidden");
  if(open){ if(ev.key === "Enter" && $("#cont")){ ev.preventDefault(); $("#cont").click(); } return; }
  const n = parseInt(ev.key, 10);
  if(n >= 1 && S.card && n <= S.card.options.length) choose(n - 1);
});

renderSelect();
</script>
