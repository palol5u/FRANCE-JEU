<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opération Naufrage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --surface:#fffdf8; --surface2:#f7f2e7; --ink:#17191f; --muted:#646a76; --line:#ddd5c4;
  --blue:#1f3c8f; --red:#d42a2f; --gold:#a97c1f; --good:#1f7a45; --bad:#c23a2e; --goodbg:#e2f2e7; --badbg:#fbe5e1;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 10px 30px rgba(20,20,30,.07);
  --overlay:rgba(18,20,26,.55);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116; --surface:#181b23; --surface2:#1f232d; --ink:#ecebe6; --muted:#9ba1ad; --line:#2c313d;
    --blue:#8aa6ff; --red:#ff6168; --gold:#e3b456; --good:#53c985; --bad:#ff6b5e; --goodbg:#163020; --badbg:#3a1a18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116; --surface:#181b23; --surface2:#1f232d; --ink:#ecebe6; --muted:#9ba1ad; --line:#2c313d;
  --blue:#8aa6ff; --red:#ff6168; --gold:#e3b456; --good:#53c985; --bad:#ff6b5e; --goodbg:#163020; --badbg:#3a1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.65);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-bottom:56px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.stripe{height:6px;background:linear-gradient(90deg,#1f3c8f 0 33.3%,#fff 33.3% 66.6%,#d42a2f 66.6%)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px}
.muted{color:var(--muted)}
h1,h2,.brand,.anton{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em}

/* ---------- Écran d'accueil ---------- */
.hero{padding:22px 0 8px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(44px,8vw,86px);line-height:.95;margin:10px 0 14px;text-transform:uppercase}
.hero h1 span{color:var(--red)}
.lead{font-size:17px;max-width:760px;margin:0 0 18px}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:900px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.goal b{display:block;font-size:15px}
.goal span{font-size:13px;color:var(--muted)}
.rules{margin:14px 0 4px;max-width:900px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rules summary{cursor:pointer;font-weight:700}
.rules ul{margin:8px 0 4px;padding-left:20px}
.rules li{margin:4px 0}
.sec{font-size:30px;margin:28px 0 12px;text-transform:uppercase}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.char{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .15s,border-color .15s}
.char:hover{transform:translateY(-3px);border-color:var(--c)}
.char .top{display:flex;gap:12px;align-items:center}
.av{width:62px;height:62px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:Anton,sans-serif;font-size:24px;position:relative;flex:none}
.av .em{position:absolute;right:-6px;bottom:-4px;font-size:22px}
.av.sm{width:38px;height:38px;font-size:15px}
.av.sm .em{font-size:14px;right:-5px;bottom:-4px}
.char h3{margin:0;font-size:19px}
.char .nick{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.char p{margin:0;font-size:14px}
.char .trait{font-size:13px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.char .diff{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.char .go{margin-top:auto;background:var(--c);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700}
.disclaimer{font-size:12px;color:var(--muted);margin-top:22px;max-width:900px}
.best{font-size:12px;color:var(--muted)}

/* ---------- Jeu ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-size:26px;text-transform:uppercase}
.brand span{color:var(--red)}
.turninfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{background:var(--ink);color:var(--bg);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px}
.me{display:flex;gap:10px;align-items:center}
.me small{display:block;color:var(--muted);font-size:12px}
.progress{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-bottom:14px}
.progress i{height:5px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--ink)}
.progress i.now{background:var(--red)}
.stats{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.num{font-family:Anton,sans-serif;font-size:28px;line-height:1.15;margin:2px 0;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.big .num{font-size:30px;color:var(--red)}
.sub{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;position:relative;margin-top:20px;overflow:visible}
.bar.nolbl{margin-top:8px}
.bar>em.end::after{left:auto;right:0;transform:none}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--fill,var(--ink));transition:width .5s}
.bar>em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);font-style:normal}
.bar>em::after{content:attr(data-l);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gold);font-weight:700;white-space:nowrap}
.tile.warn{border-color:var(--red)}
.layout{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.src{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid var(--line);background:var(--surface2)}
.src.real{color:var(--blue)}
.src.fut{color:var(--gold)}
.card h2{font-size:clamp(26px,3.4vw,36px);line-height:1.08;margin:12px 0 10px}
.card .txt{font-size:16px;margin:0 0 16px}
.jokerbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.joker{background:var(--ink);color:var(--bg);border:0;border-radius:9px;padding:8px 12px;font-weight:700}
.joker:disabled{opacity:.35;cursor:not-allowed}
.jokerbar small{color:var(--muted);flex:1;min-width:200px;font-size:12.5px}
.armed{font-size:12px;font-weight:700;color:var(--good)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:4px 12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .12s,transform .12s,background .12s}
.opt:hover{border-color:var(--ink);transform:translateX(3px);background:var(--surface2)}
.opt .k{grid-row:span 2;width:32px;height:32px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt .ot{font-weight:600}
.hints{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:600}
.hint.good{background:var(--goodbg);color:var(--good)}
.hint.bad{background:var(--badbg);color:var(--bad)}
.hint.neu{background:var(--surface2);color:var(--muted)}
.side{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto;font-size:13px}
.log li{padding:7px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border:0}
.log b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.objline{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.ok{color:var(--good);font-weight:700}
.ko{color:var(--muted)}

/* ---------- Ticker ---------- */
#ticker{position:fixed;left:0;right:0;bottom:0;height:42px;background:var(--red);color:#fff;display:none;align-items:center;overflow:hidden;z-index:20;font-weight:600;font-size:14px}
#ticker .lbl{flex:none;background:#111;color:#fff;font-family:Anton,sans-serif;letter-spacing:.04em;padding:0 14px;height:100%;display:flex;align-items:center;z-index:1;text-transform:uppercase}
#ticker .run{white-space:nowrap;display:inline-block;padding-left:100%;animation:run var(--dur,60s) linear infinite}
#ticker .run span{margin-right:48px}
#ticker .run span::before{content:"◆ ";opacity:.7}
@keyframes run{to{transform:translateX(-100%)}}
.tick-wrap{overflow:hidden;flex:1}

/* ---------- Modales ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.hidden{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:var(--shadow);animation:pop .25s ease}
.modal h3{font-family:Anton,sans-serif;font-weight:400;font-size:30px;line-height:1.1;margin:6px 0 10px}
.modal .txt{font-size:16px;margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700}
.chip.good{background:var(--goodbg);color:var(--good)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.legend{font-size:11.5px;color:var(--muted)}
.box{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.box b.t{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.alert{background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600;font-size:14px}
.alert.g{background:var(--goodbg);color:var(--good)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.crowd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.crowd>div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.crowd .num{font-size:26px}
.slider{margin:14px 0 6px}
.slider input{width:100%;accent-color:var(--blue)}
.slider .row{display:flex;justify-content:space-between;font-size:13px;gap:10px;flex-wrap:wrap}
.crsnum{font-family:Anton,sans-serif;font-size:24px}
.mopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mopts button{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.mopts button:hover{border-color:var(--ink)}
.mopts button b{display:block}
.mopts button small{color:var(--muted);font-size:12px}
.mopts button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.mopts button.primary small{color:rgba(255,255,255,.8)}

/* ---------- Toasts ---------- */
#toasts{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(360px,calc(100vw - 28px))}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:pop .25s ease}

/* ---------- Fin ---------- */
.endhero{text-align:center;padding:26px 0 10px}
.endhero h1{font-size:clamp(40px,7vw,76px);margin:6px 0 8px;line-height:1;text-transform:uppercase}
.endhero .story{max-width:720px;margin:0 auto;font-size:17px}
.score{display:inline-block;margin:18px auto 4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 26px}
.score .num{font-size:52px;color:var(--red)}
.rank{font-weight:800;font-size:18px}
.endstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.charts svg{width:100%;height:auto;display:block}
.center{text-align:center}

/* ---------- Portraits & mini-vidéos ---------- */
.face{display:block;border-radius:50%;flex:none;background:var(--surface2);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.clip{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:640/300;background:#000;margin:0 0 14px}
.clip svg{width:100%;height:100%;display:block}
.clip .live{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.62);color:#fff;font:700 11px/1 Inter,sans-serif;letter-spacing:.08em;padding:5px 8px;border-radius:6px;display:flex;gap:6px;align-items:center}
.clip .live i{width:8px;height:8px;border-radius:50%;background:#ff3030;animation:k-blink 1s linear infinite}
.clip .place{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.62);color:#fff;font:600 11px/1 Inter,sans-serif;padding:5px 8px;border-radius:6px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .cap{position:absolute;left:10px;right:10px;bottom:12px;color:#fff;font:700 13px/1.3 Inter,sans-serif;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:6px}
.clip .tlb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.clip .tlb i{display:block;height:100%;width:0;background:#ff3030;animation:k-tlb 8s linear infinite}
@keyframes k-tlb{to{width:100%}}
.react{display:flex;gap:14px;align-items:center;margin:4px 0 12px}
.bubble{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:600;font-size:14px}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--surface2);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.cardtop{display:flex;gap:14px;align-items:center}
.sound{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.endhero .clip{max-width:760px;margin:0 auto 18px}
.don{display:inline-flex;align-items:center;gap:8px;background:#ffd23f;color:#17191f;border:0;border-radius:10px;padding:12px 18px;font-weight:800;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .12s}
.don:hover{transform:translateY(-2px)}
.donbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0 0;max-width:900px;background:var(--surface);border:1px dashed var(--gold);border-radius:12px;padding:12px 14px}
.donbox p{margin:0;flex:1;min-width:220px;font-size:14px}
.side .don{justify-content:center}

/* animations des scènes (jamais d'attribut transform sur un élément animé) */
.clip [class^="a-"],.clip [class*=" a-"]{transform-box:fill-box;transform-origin:center}
.a-bob{animation:k-bob .6s ease-in-out infinite alternate}
.a-jump{animation:k-jump .45s ease-in-out infinite alternate}
.clip .a-flick{transform-origin:50% 100%;animation:k-flick .22s ease-in-out infinite alternate}
.a-smoke{animation:k-smoke 3.2s linear infinite}
.a-gas{animation:k-gas 2.6s ease-out infinite}
.a-adv{animation:k-adv 2.8s ease-in-out infinite alternate}
.a-throw{animation:k-throw 2.4s ease-in infinite}
.a-blink{animation:k-blink .5s linear infinite}
.a-blink2{animation:k-blink2 1.1s ease-in-out infinite alternate}
.a-march{animation:k-march 14s linear infinite}
.a-wave{animation:k-wave 3s linear infinite}
.a-fall{animation:k-fall 3.2s linear infinite}
.a-spin{animation:k-spin 4s linear infinite}
.a-pulse{animation:k-pulse 1.2s ease-in-out infinite alternate}
.a-drive{animation:k-drive 8s linear infinite}
.a-driveL{animation:k-driveL 12s linear infinite}
.clip .a-dance{transform-origin:50% 100%;animation:k-dance .45s ease-in-out infinite alternate}
.clip .a-beam{transform-origin:50% 0;animation:k-beam 2.6s ease-in-out infinite alternate}
.clip .a-sway{transform-origin:50% 100%;animation:k-sway 1.4s ease-in-out infinite alternate}
.clip .a-flag{transform-origin:0 50%;animation:k-flag .8s ease-in-out infinite alternate}
.a-float{animation:k-float 3s linear infinite}
.a-burst{animation:k-burst 2.2s ease-out infinite}
.a-shake{animation:k-shake .2s linear infinite alternate}
.clip .a-bang{transform-origin:80% 80%;animation:k-bang .6s ease-in-out infinite}
.a-sink{animation:k-sink 9s ease-in infinite}
.a-fly{animation:k-fly 9s linear infinite}
.a-fly2{animation:k-fly2 7s linear infinite}
.a-cloud{animation:k-cloud 14s ease-in-out infinite alternate}
.a-talk{animation:k-talk .36s linear infinite}
.clip .a-grow{transform-origin:50% 100%;animation:k-grow 4s ease-in-out infinite alternate}
.a-draw{animation:k-draw 4s ease-out infinite}
.a-yr{opacity:0;animation:k-yr 8s linear infinite}
.a-twinkle{animation:k-twinkle 1.4s ease-in-out infinite alternate}
.a-crab{animation:k-crab 3s ease-in-out infinite alternate}
.a-flash{opacity:0;animation:k-flash 2.4s linear infinite}
.a-pop{animation:k-pop 1.6s ease-out infinite}
.a-paper{animation:k-paper 3s ease-in-out infinite}
.a-swim{animation:k-swim 6s ease-in-out infinite alternate}
.a-swim2{animation:k-swim 9s ease-in-out infinite alternate}
.a-rain{animation:k-rain .8s linear infinite}
.a-dash{animation:k-dash 1s linear infinite}
.clip .a-melt{transform-origin:50% 100%;animation:k-melt 3s ease-in infinite}
@keyframes k-bob{to{transform:translateY(-6px)}}
@keyframes k-jump{to{transform:translateY(-14px)}}
@keyframes k-flick{from{transform:scale(1.05,.85)}to{transform:scale(.9,1.15)}}
@keyframes k-smoke{from{transform:translateY(0) scale(.6);opacity:.85}to{transform:translateY(-130px) scale(2.4);opacity:0}}
@keyframes k-gas{from{transform:scale(.3);opacity:.9}to{transform:scale(2.6);opacity:0}}
@keyframes k-adv{from{transform:translateX(-26px)}to{transform:translateX(12px)}}
@keyframes k-throw{0%{transform:translate(0,0) rotate(0);opacity:1}50%{transform:translate(-90px,-70px) rotate(200deg)}100%{transform:translate(-180px,20px) rotate(400deg);opacity:0}}
@keyframes k-blink{0%,49%{opacity:1}50%,100%{opacity:.1}}
@keyframes k-blink2{from{opacity:.35}to{opacity:1}}
@keyframes k-march{from{transform:translateX(-560px)}to{transform:translateX(700px)}}
@keyframes k-wave{to{transform:translateX(-80px)}}
@keyframes k-fall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(360px) rotate(540deg)}}
@keyframes k-spin{to{transform:rotate(360deg)}}
@keyframes k-pulse{to{transform:scale(1.08)}}
@keyframes k-drive{to{transform:translateX(900px)}}
@keyframes k-driveL{to{transform:translateX(-900px)}}
@keyframes k-dance{from{transform:rotate(-8deg)}to{transform:rotate(8deg) translateY(-6px)}}
@keyframes k-beam{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes k-sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes k-flag{from{transform:skewY(-8deg)}to{transform:skewY(8deg)}}
@keyframes k-float{from{transform:translateY(0);opacity:1}to{transform:translateY(-150px);opacity:0}}
@keyframes k-burst{from{transform:scale(.1);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes k-shake{from{transform:translate(-2px,0)}to{transform:translate(2px,1px)}}

{who:"melenchon", src:"Remake de 2018", title:"« La République, c’est moi ! »",
 text:"Des policiers perquisitionnent le siège de votre ancien mouvement. Les caméras sont là. Votre tension monte. Votre voix aussi.",
 options:[
  {t:"Pousser la porte en hurlant « La République, c’est moi ! »", e:{pop:-10,col:6,ass:-10}, r:"La vidéo passe en boucle à l’Assemblée, en cours d’éducation civique et dans les écoles de théâtre.", n:"« La République, c’est moi » : la vidéo étudiée au Conservatoire"},
  {t:"« Ma personne est sacrée ! », version opéra", e:{pop:-8,col:4,ass:-6}, r:"Votre interprétation est saluée par l’Opéra de Paris. Beaucoup moins par le parquet.", n:"L’Opéra de Paris propose un CDI au Président"},
  {t:"Ouvrir la porte et proposer un café", e:{pop:3}, r:"Les policiers repartent avec un café et un livre dédicacé. Personne ne vous reconnaît.", n:"Perquisition : « Il était très calme, c’était inquiétant », raconte un policier"}
 ]},
{who:"melenchon", src:"Promesse de 2012, 2017, 2022…", title:"La VIe République",
 text:"Le moment est venu de tourner la page de la Ve République, « monarchie présidentielle ». Ironie : vous êtes le monarque.",
 options:[
  {t:"Convoquer une Assemblée constituante tirée au sort", e:{d:2,pop:-3,col:5,ass:-25}, r:"Les constituants tirés au sort comprennent trois notaires, un youtubeur gaming et un chat (inscrit par erreur).", n:"Constituante : le chat vote contre l’article 1er"},
  {t:"Faire voter la VIe République par hologramme dans 12 villes", e:{d:1,pop:-2}, r:"L’hologramme bugue à Lille : vous apparaissez à l’envers. Le texte est adopté quand même.", n:"Hologramme : le Président apparaît la tête en bas à Lille"},
  {t:"Garder la Ve : finalement, le 49.3, c’est pratique", e:{pop:-9,ass:10}, r:"Vous dégainez votre premier 49.3. Vos militants découvrent qu’ils ont voté pour un Jupiter qui crie plus fort.", n:"Premier 49.3 du Tribun : « C’est un 49.3 insoumis, ça n’a rien à voir »"}
 ]},
{who:"melenchon", src:"Promesse de 2017", title:"Plan A, plan B : les traités européens",
 text:"Bruxelles retoque votre budget. Vous l’aviez toujours dit : « Plan A, on renégocie. Plan B, on désobéit. » Le moment est venu de choisir une lettre.",
 options:[
  {t:"Plan B : désobéir aux traités", e:{d:90,def:3,pop:-5,col:6}, r:"Les taux d’intérêt s’envolent. Berlin ressort les dossiers grecs de 2010 et change juste le nom du pays.", n:"Désobéissance européenne : les taux français dépassent ceux de la Grèce"},
  {t:"Plan C : négocier en hurlant en espagnol", e:{d:20,pop:-3}, r:"Personne ne comprend, mais tout le monde est impressionné.", n:"Sommet européen : le Président français fait un discours de 4 h en espagnol"},
  {t:"Plan A : rester poli", e:{pop:-6}, r:"Vous restez poli pendant toute la réunion. Ça vous fait physiquement mal.", n:"Bruxelles inquiète : le Président français a été « anormalement courtois »"}
 ]},
{who:"melenchon", src:"Promesse de 2022", title:"Nationaliser les autoroutes",
 text:"Les sociétés d’autoroutes font des profits record. Vous voulez les récupérer. Le péage de Saint-Arnoult retient son souffle.",
 options:[
  {t:"Racheter les concessions (environ 50 Md€)", e:{d:50,pop:6}, r:"L’État récupère les autoroutes. Les aires de repos sont rebaptisées « Aires Jean-Jaurès ».", n:"Autoroutes nationalisées : les sandwiches triangle restent à 7,90 €"},
  {t:"Les racheter ET rendre les péages gratuits", e:{d:50,def:2.5,pop:11,col:-6}, r:"Les Français partent en vacances gratuitement. Les bouchons, eux, sont collectivisés.", n:"Péages gratuits : 1 400 km de bouchon le premier samedi d’août"},
  {t:"Nationaliser aussi les boulangeries et les PMU", e:{d:12,pop:-9,col:5}, r:"La baguette d’État arrive après un formulaire Cerfa. Elle est tiède et rassise.", n:"Boulangeries nationalisées : la tradition passe au format A4"}
 ]},
{who:"melenchon", src:"Obsession personnelle", title:"La France, puissance maritime",
 text:"« La France possède le deuxième domaine maritime du monde ! » répétez-vous depuis quinze ans. Il est temps de passer aux actes.",
 options:[
  {t:"Lancer la conquête des abysses : 40 Md€ de sous-marins scientifiques", e:{d:40,pop:-2}, r:"Les sous-marins découvrent une nouvelle espèce de poisson. Elle est baptisée « Insoumis abyssus ».", n:"Abysses : découverte d’un poisson qui refuse de se soumettre"},
  {t:"Déménager le ministère de l’Économie aux îles Kerguelen", e:{d:3,pop:-4,ass:-8}, r:"Le ministre arrive après trois semaines de bateau. Les manchots refusent de voter le budget.", n:"Kerguelen : le ministre de l’Économie négocie avec des manchots"},
  {t:"Tenir un meeting sur un porte-avions", e:{d:0.8,pop:1}, r:"Votre voix porte jusqu’à Madagascar. Le porte-avions, lui, est en panne au milieu du discours.", n:"Meeting sur le porte-avions : 3 h 20 de discours, 2 mouettes conquises"}
 ]},
{who:"melenchon", src:"Promesse de 2012", title:"Le revenu maximum",
 text:"Vous avez toujours voulu un « revenu maximum ». Reste à fixer le maximum. Vos conseillers proposent un chiffre. Vous en proposez un autre, plus bas.",
 options:[
  {t:"Taxer à 100 % au-delà de 400 000 € par an", e:{def:1,pop:4,col:-4}, r:"Footballeurs, rappeurs et trois PDG demandent l’asile fiscal en Belgique. Les recettes baissent. La SNCF ouvre une nouvelle ligne Paris–Bruxelles.", n:"Exode fiscal : la Belgique manque de logements de luxe"},
  {t:"Taxer à 100 % au-delà de 4 000 € par mois", e:{def:3,pop:-15,col:12}, r:"Cadres, médecins et pilotes de ligne s’en vont. Les avions ne décollent plus. Pas grave : le kérosène est bloqué aussi.", n:"Revenu maximum : les médecins partent en Suisse en covoiturage"},
  {t:"Taxer les yachts à 300 %", e:{def:-0.3,pop:5}, r:"Les yachts partent à Monaco. Les ports français redeviennent pittoresques.", n:"Taxe yacht à 300 % : Saint-Tropez retrouve ses pédalos"}
 ]},
{who:"melenchon", src:"Promesse de 2022", title:"La semaine de 32 heures",
 text:"Vous voulez réduire le temps de travail. Le Medef a convoqué une réunion de crise. Elle dure 12 heures, sans pause.",
 options:[
  {t:"Passer à 32 heures payées 35", e:{def:4,pop:6,col:-5}, r:"Le vendredi devient le jour national du barbecue. Les entreprises s’adaptent en grognant.", n:"32 heures : le vendredi rebaptisé « samedi bis »"},
  {t:"Passer à 4 jours… de 4 heures", e:{def:10,pop:2,ass:-20}, r:"La productivité s’effondre. La sieste devient sport national. Le PIB fait une crise existentielle.", n:"Semaine de 16 h : la France championne du monde de la sieste"},
  {t:"Rester à 35 h, mais avec plus de pauses café", e:{pop:-4}, r:"Une réforme si timide que personne ne l’a remarquée. Sauf les machines à café.", n:"Réforme du temps de travail : les machines à café en surchauffe"}
 ]},
{who:"melenchon", src:"Remake de 2017", title:"Les hologrammes",
 text:"En 2017, vous teniez des meetings en hologramme. Vos conseillers pensent qu’on peut aller beaucoup plus loin.",
 options:[
  {t:"Tenir 50 meetings simultanés en hologramme", e:{d:0.5,pop:-2}, r:"Cinquante Tribuns parlent en même temps. L’Arcom est saisie pour tapage nocturne.", n:"50 hologrammes présidentiels : les voisins portent plainte"},
  {t:"Remplacer tout le gouvernement par des hologrammes", e:{d:4,pop:-5,ass:-15}, r:"Les ministres-hologrammes coûtent moins cher en salaires mais beaucoup plus en électricité. EDF dit merci.", n:"Gouvernement d’hologrammes : un ministre disparaît lors d’une coupure de courant"},
  {t:"Rester en vrai, en chair et en colère", e:{pop:1}, r:"Les Français apprécient votre présence physique. Surtout la voix.", n:"Le Président apparaît en vrai : « Il est plus grand en hologramme »"}
 ]},

/* ======================= LE PEN ======================= */
{who:"lepen", first:true, src:"Promesse de 2022", title:"La TVA sur l’énergie",
 text:"Premier jour à l’Élysée. Vous avez promis de « rendre l’argent aux Français ». Bercy vous rappelle qu’en fait, il n’y en a pas. Vous répondez que c’est son problème à lui.",
 options:[
  {t:"Baisser la TVA sur l’énergie de 20 % à 5,5 %", e:{def:3,pop:8,col:-6}, r:"Le plein coûte un peu moins cher. Les Français roulent un peu plus. Le déficit aussi.", n:"TVA énergie : les stations-service prises d’assaut"},
  {t:"TVA à 0 % sur les pâtes, le jambon, l’essence et les croquettes", e:{def:6,pop:5,col:-4}, r:"La France entière mange des pâtes au jambon en voiture. Le chat de l’Élysée prend deux kilos.", n:"TVA zéro : record historique de consommation de coquillettes-jambon"},
  {t:"Augmenter la TVA… pour financer la baisse de la TVA", e:{pop:-12,col:8}, r:"Personne ne comprend ce montage. Vous non plus. Mais ça a l’air rigoureux.", n:"Bercy : « Ce montage fiscal est soit génial, soit illégal »"}
 ]},
{who:"lepen", src:"Promesse de 2022", title:"Les moins de 30 ans exonérés d’impôt",
 text:"Vous aviez promis d’exonérer d’impôt sur le revenu les jeunes de moins de 30 ans. Jordan, 31 ans, trouve que la limite est mal placée.",
 options:[
  {t:"Exonérer les moins de 30 ans", e:{def:2,pop:4}, r:"Les jeunes adorent. Les 30 ans et un jour sont furieux.", n:"Impôt : vague de dépressions chez les trentenaires"},
  {t:"Exonérer les moins de 50 ans (c’est à peu près pareil)", e:{def:12,pop:6,ass:-10}, r:"La moitié du pays ne paie plus d’impôt sur le revenu. L’autre moitié se teint les cheveux et triche sur son âge.", n:"Fraude à l’âge : des quinquagénaires en sweat à capuche devant les impôts"},
  {t:"Exonérer uniquement les éleveurs de chats", e:{def:0.2,pop:-4}, r:"Mesure jugée « très ciblée » par le Conseil constitutionnel. Deux millions de Français se découvrent éleveurs de chats.", n:"Boom des élevages félins : « J’ai trois chats, donc zéro impôt »"}
 ]},
{who:"lepen", src:"Remake de 2017", title:"Frexit ? Non. Oui. Peut-être.",
 text:"En 2017, vous vouliez sortir de l’euro. En 2022, plus du tout. Les marchés demandent une clarification. Vos conseillers aussi. Vous aussi, un peu.",
 options:[
  {t:"Sortir de l’euro et revenir au franc", e:{d:300,def:4,pop:-12,col:12}, r:"Le nouveau franc perd 30 % le premier jour. Les Français font des allers-retours en Belgique pour acheter du beurre. Les Suisses rigolent.", n:"Retour du franc : la baguette à 9,80 F, les Belges ravis"},
  {t:"Une « monnaie commune » : l’euro pour les entreprises, le franc pour la baguette", e:{d:70,pop:-9,col:5}, r:"Une baguette coûte 1,20 € ou 7,80 F selon le jour. Les boulangers font des maths. Les maths gagnent.", n:"Double monnaie : les caissières demandent une prime de calcul mental"},
  {t:"Ne plus jamais en parler", e:{pop:2}, r:"Le sujet disparaît. Comme le programme de 2017.", n:"Euro : le sujet officiellement « classé sans suite »"}
 ]},
{who:"lepen", src:"Inspiré de faits réels", title:"Jordan sur TikTok",
 text:"Votre Premier ministre a des millions d’abonnés. Il propose de gouverner exclusivement par vidéos de 59 secondes.",
 options:[
  {t:"Le laisser annoncer le budget avec un filtre", e:{d:10,pop:3,ass:-12}, r:"Le budget est présenté en 59 secondes sur un son à la mode. Les chiffres défilent trop vite pour être lus. C’est voulu.", n:"Budget présenté sur TikTok : « J’ai rien compris mais c’était stylé »"},
  {t:"Lui confier aussi le ministère des Finances", e:{def:3,pop:-5,ass:-10}, r:"Il demande à ses abonnés « comment faire un budget ». Le commentaire le plus liké : « imprimer des billets ».", n:"Bercy : le ministre suit un tutoriel « budget pour les nuls »"},
  {t:"Lui interdire les réseaux sociaux", e:{pop:-6}, r:"Il fait une vidéo pour se plaindre de l’interdiction. 30 millions de vues.", n:"Interdit de TikTok, le Premier ministre fait un live pour protester"}
 ]},
{who:"lepen", src:"Inspiré de faits réels (éleveuse de chats)", title:"Les chats de l’Élysée",
 text:"Vos chats ont pris possession du bureau présidentiel. L’un d’eux dort sur le bouton de la dissuasion nucléaire. Il faut une politique féline ambitieuse.",
 options:[
  {t:"Créer un ministère de la Condition féline", e:{d:1,pop:-3}, r:"Le ministère compte 400 agents et 1 200 chats. Les agents sont moins bien traités.", n:"Ministère des Chats : grève des agents, pas des chats"},
  {t:"Chèque croquettes pour tous les foyers", e:{def:0.6,pop:3}, r:"Les chats de France votent pour vous en masse. Malheureusement, les humains aussi.", n:"Chèque croquettes : les chiens dénoncent une injustice"},
  {t:"Nommer un chat Premier ministre", e:{pop:-6,ass:-25}, r:"Le chat dort pendant les questions au gouvernement, griffe un député et fait tomber un verre de la tribune. Il tient plus longtemps que trois de ses prédécesseurs.", n:"Matignon : le Premier ministre ronronne pendant la motion de censure"}
 ]},
{who:"lepen", src:"Remake de 2025", title:"La justice frappe à la porte",
 text:"L’affaire des assistants parlementaires européens revient hanter le palais. Un juge pose des questions. Vous avez une idée : y répondre très fort, à la télévision.",
 options:[
  {t:"Dénoncer la « tyrannie des juges » au journal de 20 h", e:{pop:-6,col:8,ass:-15}, r:"Le Conseil supérieur de la magistrature publie un communiqué. Les juristes de France s’étouffent dans leur café.", n:"Magistrats : « On a l’habitude, on a déjà vu la saison 1 »"},
  {t:"Tout rembourser… avec l’argent du contribuable", e:{d:0.01,pop:-8}, r:"Vous payez avec l’argent des Français. Les Français s’en aperçoivent.", n:"Remboursement : « techniquement, c’est vous qui avez payé », explique l’Élysée"},
  {t:"Se faire réhabiliter par référendum", e:{d:0.25,pop:-5,ass:-10}, r:"Question posée : « Êtes-vous d’accord avec moi ? » Taux de participation : 11 %.", n:"Référendum : 89 % d’abstention, un record"}
 ]},
{who:"lepen", src:"Promesse de 2022 (RIC)", title:"Le référendum permanent",
 text:"Vous aviez promis de redonner la parole au peuple. Le peuple, lui, n’avait rien demandé de précis.",
 options:[
  {t:"Un référendum par semaine sur tout (y compris la couleur des bancs)", e:{d:10,pop:-6,col:4}, r:"Les Français votent 52 fois par an. Participation au référendum n°34 sur l’heure d’hiver : 4 %.", n:"Référendum n°34 : l’heure d’hiver l’emporte avec 812 voix"},
  {t:"Un référendum pour savoir s’il faut faire des référendums", e:{d:0.2,pop:-2}, r:"Résultat : 50,01 % pour. Un nouveau référendum est demandé pour savoir si le résultat compte.", n:"Méta-référendum : la France vote pour savoir si elle a voté"},
  {t:"Pas de référendum, finalement le Parlement c’est très bien", e:{pop:-5,ass:8}, r:"Vos électeurs découvrent que vous aimez le Parlement. Choc.", n:"La Présidente défend le Parlement : les députés sous le choc"}
 ]},
{who:"lepen", src:"Remake de 2014", title:"Le prêt d’une banque étrangère",
 text:"Les grandes banques boudent les obligations françaises. Une petite banque d’Europe de l’Est, au nom imprononçable, propose de financer le Trésor. Le taux ? « On en reparlera. »",
 options:[
  {t:"Accepter : 50 Md€ à 9 %", e:{d:50,def:1.1,pop:-8,ass:-15}, r:"La France est désormais financée par une banque dont le siège est un appartement au 4e étage sans ascenseur.", n:"Dette française : le nouveau créancier n’a pas de site internet"},
  {t:"Refuser et lancer un « Emprunt Patriote » auprès des Français", e:{d:30,pop:3}, r:"Les Français prêtent leur Livret A à l’État. L’État leur rend des bons du Trésor avec votre photo dessus.", n:"Emprunt Patriote : 30 Md€ levés, dont 4 en pièces jaunes"},
  {t:"Emprunter à vos chats (ils ont des économies)", e:{pop:-2}, r:"Les chats acceptent contre trois tonnes de croquettes. C’est le meilleur taux du marché.", n:"Finance : les chats de l’Élysée meilleurs gestionnaires que Bercy"}
 ]},
{who:"lepen", src:"Promesse de 2022", title:"Retraites : promesse ou réalité ?",
 text:"Vous aviez promis la retraite à 60 ans pour les carrières longues. Les carrières longues, elles, s’en souviennent très bien.",
 options:[
  {t:"Retraite à 60 ans pour les carrières longues", e:{def:3,pop:6,col:-6}, r:"Promesse tenue. Les électeurs n’en reviennent pas. Bercy non plus.", n:"Retraites : une promesse de campagne tenue, les politologues sidérés"},
  {t:"Retraite à 62 ans pour tout le monde", e:{def:5,pop:5,col:-8,ass:-10}, r:"Retour à 2010. Les marchés regardent la France comme on regarde un ex qui rappelle à 2 h du matin.", n:"Retraite à 62 ans : « Retour vers le futur », titre la presse"},
  {t:"Finalement 64 ans, « il faut être responsable »", e:{def:-1,pop:-13,col:12}, r:"Vos électeurs entendent le mot « responsable » dans votre bouche pour la première fois. Ils changent de chaîne.", n:"Retraites : la Présidente découvre la rigueur, ses électeurs découvrent la colère"}
 ]},
{who:"lepen", src:"Promesse de 2022", title:"Privatiser l’audiovisuel public",
 text:"Vous trouvez que l’audiovisuel public coûte cher et ne vous aime pas assez. Deux défauts majeurs.",
 options:[
  {t:"Privatiser France Télévisions et Radio France", e:{d:-3,pop:-6,col:7}, r:"Les chaînes sont rachetées par un milliardaire qui remplace le JT par du télé-achat.", n:"Audiovisuel privatisé : le JT de 20 h remplacé par une vente de casseroles"},
  {t:"Vendre les feuilletons du service public à une plateforme américaine", e:{d:-0.2,pop:-3}, r:"Les feuilletons français sont doublés en anglais avec l’accent texan. C’est un succès aux États-Unis.", n:"Les séries françaises cartonnent au Texas"},
  {t:"Créer une chaîne d’État qui diffuse vos discours et des vidéos de chats", e:{d:1.5,pop:-7}, r:"Audience : excellente pour les chats, catastrophique pour les discours.", n:"La chaîne présidentielle : 98 % de l’audience pendant les vidéos de chats"}
 ]},
{who:"lepen", src:"Programme", title:"Le protectionnisme « intelligent »",
 text:"Vous voulez protéger l’économie française. Vos conseillers ont préparé une liste de produits étrangers à taxer. Elle fait 400 pages et inclut le café.",
 options:[
  {t:"Droits de douane de 30 % sur toutes les importations", e:{def:2,pop:2,col:8}, r:"Les smartphones coûtent 2 400 €. Les Français ressortent leurs vieux téléphones à clapet. Inflation à 9 %.", n:"Protectionnisme : retour en force du téléphone à clapet"},
  {t:"Interdire les fraises espagnoles", e:{pop:3,col:3}, r:"Madrid interdit le camembert. L’escalade est lancée : c’est la guerre de la fraise.", n:"Guerre de la fraise : l’Espagne riposte sur le camembert"},
  {t:"Obliger tous les ministres à rouler en voiture française", e:{d:0.2,pop:1}, r:"Les ministres arrivent en retard au Conseil, coincés derrière une voiture sans permis.", n:"Conseil des ministres retardé : embouteillage de voitures françaises"}
 ]},

/* ======================= COMMUNES ======================= */
{who:"all", src:"Remake de 2018", title:"La taxe carbone sur le gazole",
 text:"Bercy a une idée pour sauver la planète et le budget : augmenter le prix du gazole. Les ronds-points de France retiennent leur souffle.",
 options:[
  {t:"+10 centimes le litre, pour la planète", e:{def:-1.5,pop:-8,col:18}, manif:"gj", r:"Des millions de gilets jaunes sortent des coffres de voiture. Les ronds-points redeviennent des lieux de vie.", n:"Carburant : « la fin du mois avant la fin du monde » fait son grand retour"},
  {t:"Annuler la hausse et verser une « prime carburant » de 100 €", e:{d:5,def:0.5,pop:3,col:-5}, r:"Les Français touchent 100 € et les dépensent en gazole. La planète, elle, ne touche rien.", n:"Prime carburant : 100 € pour tout le monde, 0 € pour la planète"},
  {t:"Taxer aussi les vélos, les trottinettes et la marche à pied", e:{def:-0.2,pop:-12,col:12}, r:"Une taxe sur les semelles est créée. Les Français marchent pieds nus en signe de protestation.", n:"Taxe sur les semelles : les cordonniers entrent en résistance"}
 ]},
{who:"all", src:"Remake de 2025", title:"Supprimer deux jours fériés",
 text:"Bercy a calculé qu’en travaillant deux jours de plus, la France gagnerait quelques milliards. Il faut choisir lesquels sacrifier.",
 options:[
  {t:"Supprimer le lundi de Pâques et le 8 mai", e:{def:-1,pop:-12,col:12}, r:"Les anciens combattants et les chocolatiers manifestent ensemble. Une alliance inédite.", n:"Jours fériés : alliance historique entre chocolatiers et anciens combattants"},
  {t:"Supprimer le 14 juillet (trop cher en feux d’artifice)", e:{def:-0.3,pop:-16,col:14}, r:"Pour la première fois depuis 1880, pas de défilé. Les Français descendent quand même sur les Champs-Élysées, mais pour manifester.", n:"Pas de 14 juillet : les pompiers organisent quand même leur bal, par résistance"},
  {t:"Créer un jour férié : la Saint-Fromage", e:{def:1,pop:6,col:-4}, r:"Le premier jeudi de mars est désormais férié. Le comté remercie la Nation.", n:"Saint-Fromage : 67 millions de Français fêtent le camembert"}
 ]},
{who:"all", src:"Remake de 2025", title:"La taxe Zucman",
 text:"Un économiste propose de taxer à 2 % les patrimoines de plus de 100 millions d’euros. Environ 1 800 foyers sont concernés. Les plateaux télé s’enflamment comme s’il s’agissait de toute la France.",
 options:[
  {t:"Adopter la taxe à 2 %", e:{def:-3.5,pop:6,col:-6}, r:"Trois milliardaires annoncent leur départ en Belgique (comme en 2012, 2017 et 2022). Aucun ne part.", n:"Taxe sur les ultra-riches : les déménageurs belges attendent toujours"},
  {t:"Refuser : « les milliardaires sont une espèce fragile »", e:{pop:-7,col:9}, r:"Vous créez une réserve naturelle pour milliardaires. Elle est située à Saint-Tropez.", n:"Le gouvernement classe les milliardaires « espèce protégée »"},
  {t:"Créer un bouclier fiscal en or massif", e:{def:2,pop:-12,col:10}, r:"Le bouclier est exposé à Bercy. Il est volé le lendemain avec un monte-meubles.", n:"Bercy : le bouclier fiscal en or a disparu"}
 ]},
{who:"all", src:"Remake de 2024", title:"Les tracteurs sur le périph’",
 text:"Les agriculteurs bloquent les autoroutes autour de Paris. Ils réclament moins de normes, plus de revenus, et que quelqu’un, quelque part, comprenne enfin la PAC.",
 options:[
  {t:"Céder sur tout : gazole agricole, normes, subventions", e:{d:2,def:1,pop:4,col:-8}, r:"Les tracteurs rentrent à la ferme. Bruxelles fait les gros yeux. Les agriculteurs aussi, par habitude.", n:"Agriculteurs : levée des blocages, « jusqu’à la prochaine fois »"},
  {t:"Envoyer les CRS face aux tracteurs", e:{col:8,pop:-2}, manif:"agri", r:"Vous envoyez les CRS. Les agriculteurs sortent le lisier.", n:"Face-à-face tendu entre CRS et tracteurs sur l’A6"},
  {t:"Aller au Salon de l’Agriculture tapoter une vache", e:{pop:-3,col:6}, r:"La vache vous écrase le pied. Les agriculteurs applaudissent la vache.", n:"Salon de l’Agriculture : la vache plus applaudie que le chef de l’État"}
 ]},
{who:"all", src:"Remake de 2025", title:"Les agences de notation s’impatientent",
 text:"Moody’s, S&P et Fitch « observent la France avec attention ». C’est la phrase qu’emploient les banquiers juste avant de vous dégrader.",
 options:[
  {t:"Promettre des économies que vous ne ferez jamais", e:{pop:-2}, r:"Les agences notent votre promesse. Elles notent aussi qu’elles l’ont déjà entendue quatorze fois.", n:"Promesse d’économies n°15 : les agences de notation baillent"},
  {t:"Les insulter au journal de 20 h", e:{d:20,pop:3,col:-2}, r:"Le spread français s’envole. L’Italie emprunte moins cher que la France. Rome envoie ses condoléances.", n:"Les taux français dépassent ceux de l’Italie : Rome envoie des fleurs"},
  {t:"Inviter les analystes dans une brasserie chic des Champs-Élysées", e:{d:0.01,pop:-6}, r:"La soirée se termine à 3 h du matin. La note est maintenue. L’addition aussi.", n:"Dîner avec les agences de notation : « une soirée AAA »"}
 ]},
{who:"all", src:"Remake de 2024", title:"Se baigner dans la Seine",
 text:"Après plus d’un milliard d’euros de travaux, la Seine est déclarée « baignable » (certains jours, si le vent est favorable et qu’il n’a pas plu). Les caméras attendent un plongeon présidentiel.",
 options:[
  {t:"Plonger en direct devant les caméras", e:{pop:3}, r:"Vous plongez avec panache. Les Français trouvent ça courageux. Votre popularité monte. Zut.", n:"Plongeon présidentiel dans la Seine : 12 millions de téléspectateurs",
   alt:{p:0.6, e:{pop:-5,col:2}, r:"Vous plongez. Trois jours de gastro. La photo de vous, verdâtre, sortant de la Seine fait la une de la presse mondiale.", n:"Gastro présidentielle : la photo du plongeon fait le tour du monde"}},
  {t:"Lancer un plan « Seine 2 » à 3 Md€ pour que ce soit vraiment propre", e:{d:3,pop:1}, r:"La Seine devient si propre qu’on y retrouve des poissons. Ils demandent à repartir.", n:"Plan Seine 2 : des poissons signalés, l’un d’eux porte plainte"},
  {t:"Envoyer un ministre plonger à votre place", e:{pop:-2,ass:-5}, r:"Le ministre plonge. Il ressort avec une trottinette électrique et une otite.", n:"Le ministre ressort de la Seine avec une trottinette"}
 ]},
{who:"all", src:"Remake de 2022", title:"Pénurie de moutarde",
 text:"Les rayons sont vides. Plus de moutarde de Dijon depuis trois semaines. La France est au bord de l’implosion gastronomique.",
 options:[
  {t:"Nationaliser la moutarde de Dijon", e:{d:1.2,pop:2}, r:"La moutarde d’État arrive en pots tricolores. Elle monte au nez, comme le budget.", n:"La moutarde nationalisée : « Ça nous monte au nez », reconnaît Bercy"},
  {t:"Importer 40 000 tonnes de moutarde américaine sucrée", e:{pop:-7,col:4}, r:"Une moutarde jaune fluo envahit les rayons. Les Bourguignons entrent en résistance.", n:"Moutarde américaine : la Bourgogne au bord de la sécession"},
  {t:"Créer un Haut-Commissariat à la Moutarde (avec voiture de fonction)", e:{d:0.1,pop:-3}, r:"Le Haut-Commissaire produit un rapport de 300 pages. Toujours pas de moutarde.", n:"Haut-Commissariat à la Moutarde : un rapport, zéro pot"}
 ]},
{who:"all", src:"Remake de 2023", title:"Panique aux punaises de lit",
 text:"Des punaises de lit sont signalées dans le métro, les cinémas et les TGV. Paris est en état d’alerte. Les Français dorment debout.",
 options:[
  {t:"Plan Marshall anti-punaises : 2 Md€", e:{d:2,pop:2}, r:"Des chiens renifleurs sont déployés dans tout le pays. Les punaises déménagent en Belgique.", n:"Punaises : la Belgique dénonce une « migration organisée »"},
  {t:"Déclarer que c’est une opération de désinformation étrangère", e:{pop:-3,col:3}, r:"Les punaises, elles, ne lisent pas les communiqués. Elles continuent.", n:"Le gouvernement accuse les punaises d’ingérence étrangère"},
  {t:"Réunir un Conseil de défense « punaises » dans le bunker de l’Élysée", e:{d:0.05,pop:-2}, r:"On découvre des punaises dans le bunker. Le Conseil de défense est évacué.", n:"Bunker de l’Élysée évacué : les punaises gagnent la bataille"}
 ]},
{who:"all", src:"Remake d’octobre 2025", title:"Casse du siècle au Louvre",
 text:"Des voleurs ont dérobé des bijoux de la Couronne en quelques minutes, avec un monte-meubles, en plein jour. Le monde entier rigole. Les assureurs, moins.",
 options:[
  {t:"Racheter des bijoux neufs place Vendôme", e:{d:0.1,pop:-5}, r:"Les nouveaux bijoux sont magnifiques et très chers. Ils sont volés trois semaines plus tard, avec le même monte-meubles.", n:"Louvre : les nouveaux bijoux volés, le monte-meubles « reconnu sur les images »"},
  {t:"Doubler la sécurité de tous les musées : 10 000 vigiles", e:{d:1,def:0.1,pop:1}, r:"Il y a désormais plus de vigiles que de visiteurs au musée de la Chasse et de la Nature.", n:"Musées : un vigile par tableau, deux pour la Joconde"},
  {t:"Vendre la Joconde à un fonds souverain pour éponger la dette", e:{d:-30,pop:-20,col:14}, r:"Elle part pour 30 Md€. Elle sourit encore moins. La dette baisse… de l’équivalent de deux mois de déficit.", n:"La Joconde vendue : « Elle avait l’air soulagée », selon un gardien"}
 ]},
{who:"all", src:"Remake de 2025", title:"Droits de douane américains",
 text:"Washington impose 50 % de droits de douane sur le vin, le fromage et les sacs de luxe français. Le comté est en état de choc.",
 options:[
  {t:"Riposter : 50 % sur les sodas, les burgers et les séries", e:{def:1,pop:5,col:3}, r:"Les Français redécouvrent la limonade et les séries belges. Moral en hausse. Mauvais signe pour vous.", n:"Guerre commerciale : les Français redécouvrent la limonade"},
  {t:"Offrir au président américain une Tour Eiffel miniature en or", e:{d:0.5,pop:-6}, r:"Il adore. Il augmente les droits de douane à 70 % « pour en avoir une deuxième ».", n:"Tour Eiffel en or offerte : les droits de douane passent à 70 %"},
  {t:"Subventionner les viticulteurs : 3 Md€", e:{d:3,def:0.3,pop:3}, r:"Les viticulteurs boivent leur stock à votre santé. Littéralement.", n:"Viticulture : 3 milliards et beaucoup de bouteilles ouvertes"}
 ]},
{who:"all", src:"Remake de 2019 et 2022", title:"Grève SNCF à Noël",
 text:"Les contrôleurs menacent de faire grève pendant les fêtes. 8 millions de Français risquent de passer Noël sans leur belle-mère. Certains sont ravis.",
 options:[
  {t:"Céder : prime de Noël pour les contrôleurs", e:{d:0.8,pop:-2,col:-3}, r:"Les trains roulent. Les autres fonctionnaires demandent immédiatement la même chose.", n:"SNCF : la grève est levée, les aiguilleurs du ciel prennent le relais"},
  {t:"Réquisitionner les cheminots", e:{pop:-6,col:10,ass:-5}, r:"Les cheminots réquisitionnés conduisent les trains… à 30 km/h, en chantant l’Internationale.", n:"Réquisition : le TGV Paris–Marseille met 11 heures"},
  {t:"Remplacer les TGV par des autocars low-cost", e:{pop:-3,col:3}, r:"Paris–Nice en 14 heures, avec escale à Clermont-Ferrand. Joyeux Noël.", n:"Autocars de Noël : un passager arrive pour le Nouvel An"}
 ]},
{who:"all", src:"Remake permanent", title:"L’hôpital craque",
 text:"Les urgences débordent, les soignants démissionnent, et un patient attend depuis tellement longtemps qu’il a été élu délégué du couloir.",
 options:[
  {t:"Ségur de la santé n°2 : +10 Md€", e:{d:3,def:2.5,pop:6,col:-6}, r:"Les soignants sont augmentés. Ils ont enfin le temps de déjeuner (debout).", n:"Ségur 2 : les infirmières reçoivent leur prime, et une chaise"},
  {t:"Fermer les urgences la nuit", e:{def:-0.5,pop:-12,col:12}, r:"Il est désormais conseillé de tomber malade entre 9 h et 17 h, hors week-ends et jours fériés.", n:"Urgences : « Merci de rappeler aux heures ouvrables »"},
  {t:"Remplacer les médecins par une IA qui répond « buvez de l’eau »", e:{d:2,pop:-8,col:5}, r:"L’IA diagnostique une jambe cassée comme « fatigue passagère ». Elle est nommée cheffe de service.", n:"Santé : l’IA « Docteur Doliprane » déployée dans 300 hôpitaux"}
 ]},
{who:"all", src:"Remake permanent", title:"Réforme de l’école n°43",
 text:"Le niveau baisse, disent les études. Le nombre de ministres de l’Éducation, lui, monte. Il faut agir.",
 options:[
  {t:"Uniforme obligatoire dans toutes les écoles", e:{d:1.5,pop:2}, r:"Les élèves portent l’uniforme. Le niveau ne change pas, mais les photos de classe sont plus jolies.", n:"Uniforme : les photos de classe en net progrès"},
  {t:"Supprimer les vacances d’été pour « rattraper le niveau »", e:{def:-0.5,pop:-15,col:15}, manif:"profs", r:"Les profs, les parents, les élèves, les campings et les vendeurs de glaces manifestent ensemble.", n:"Plus de grandes vacances : les marchands de glaces descendent dans la rue"},
  {t:"Nommer le sixième ministre de l’Éducation de l’année", e:{pop:-3,ass:-6}, r:"Le nouveau ministre annonce une grande réforme. Il est remplacé avant de l’avoir écrite.", n:"Éducation : le ministre remplacé pendant son discours de passation"}
 ]},
{who:"all", src:"🔮 Futur possible", title:"L’emprunt du siècle",
 text:"Bercy propose un grand emprunt pour « investir dans l’avenir ». L’avenir est flou. L’emprunt, lui, est très concret.",
 options:[
  {t:"Emprunter 200 Md€ pour « investir dans l’avenir »", e:{d:200,def:1,pop:2}, r:"Les 200 Md€ financent 1 200 comités Théodule et 400 rapports sur l’avenir. L’avenir est très bien documenté.", n:"Grand emprunt : l’avenir financé, mais personne ne sait lequel"},
  {t:"Émettre une obligation perpétuelle à 6 %", e:{d:80,def:1.2,pop:-3}, r:"Vos arrière-arrière-petits-enfants paieront. Heureusement, ils ne votent pas encore.", n:"Dette perpétuelle : « Nos descendants vont adorer », plaisante Bercy"},
  {t:"Lancer une cagnotte en ligne « Sauvons la France »", e:{d:0.003,pop:-5}, r:"La cagnotte récolte 2,7 M€, dont 2 M€ d’un milliardaire qui demande un ministère en échange.", n:"Cagnotte nationale : 2,7 millions récoltés, soit 4 minutes de déficit"}
 ]},
{who:"all", src:"Remake de 2019", title:"Les dîners du ministre",
 text:"Un média révèle que votre ministre de l’Écologie organisait des dîners au homard géant et aux grands crus, aux frais de la République.",
 options:[
  {t:"Le soutenir : « Le homard, c’est aussi la biodiversité »", e:{pop:-7,col:4}, r:"La phrase devient culte. Les homards, eux, ne la trouvent pas drôle.", n:"« Le homard, c’est la biodiversité » : la SPA des crustacés s’indigne"},
  {t:"Instaurer le « chèque homard » pour tous les Français", e:{def:2,pop:5}, r:"Chaque foyer reçoit un homard. La Bretagne est en rupture de stock. Les Français sont ravis. Dommage.", n:"Chèque homard : la Bretagne en pénurie de crustacés"},
  {t:"Interdire le homard dans les ministères", e:{pop:1}, r:"Les ministres passent à la langouste. Personne ne remarque la différence.", n:"Homard interdit : les ministres se rabattent sur la langouste"}
 ]},
{who:"all", src:"🔮 Futur très probable", title:"Canicule de juillet",
 text:"Il fait 46 °C à Paris. Les écoles sont des fours, les trains déraillent de chaleur, et l’Assemblée siège en tongs.",
 options:[
  {t:"Climatiser toutes les écoles : 20 Md€", e:{d:20,pop:3}, r:"Les écoles deviennent les endroits les plus frais de France. Les parents demandent à y dormir.", n:"Écoles climatisées : les parents veulent s’inscrire en CM2"},
  {t:"Distribuer un ventilateur USB à chaque Français", e:{d:0.2,pop:-6,col:5}, r:"Le ventilateur souffle de l’air chaud avec un petit bruit. Il est rebaptisé « le gouvernement ».", n:"Ventilateurs USB : « Ça brasse du vent, comme à Matignon »"},
  {t:"Décaler l’été au mois de novembre par décret", e:{pop:-3,ass:-5}, r:"Le Conseil d’État valide le décret. Le soleil, lui, ne l’a pas lu.", n:"L’été décalé par décret : le soleil n’a pas été consulté"}
 ]},
{who:"all", src:"Remake de 2022", title:"Crise de l’énergie",
 text:"Le prix de l’électricité est multiplié par trois. Les boulangers éteignent leurs fours, les patinoires ferment et les Français dorment avec trois couettes.",
 options:[
  {t:"Bouclier tarifaire XXL", e:{d:40,def:2,pop:5,col:-10}, r:"Les factures sont gelées. Le déficit, lui, est en ébullition.", n:"Bouclier tarifaire : 40 milliards pour que les Français n’aient pas froid"},
  {t:"Conseiller aux Français de porter un col roulé", e:{pop:-6,col:5}, r:"Le col roulé devient le symbole national de la résistance… au froid.", n:"Col roulé : les ventes explosent, la popularité s’effondre"},
  {t:"Laisser les prix exploser : « c’est le marché »", e:{pop:-12,col:15}, r:"Le marché est très content. Les Français, moins.", n:"Électricité : les factures dépassent le prix d’un loyer"}
 ]},
{who:"all", src:"Remake de 2024", title:"Bruxelles hausse le ton",
 text:"La Commission européenne ouvre une procédure pour déficit excessif contre la France. Un commissaire néerlandais soupire si fort qu’on l’entend depuis Paris.",
 options:[
  {t:"Promettre 3 % de déficit « en 2034 au plus tard »", e:{pop:-1}, r:"Bruxelles prend note. Elle a un tiroir spécial pour les promesses françaises. Il déborde.", n:"Bruxelles : le tiroir des promesses françaises ne ferme plus"},
  {t:"Répondre par une lettre d’insultes en alexandrins", e:{d:15,pop:4,col:-2}, r:"La lettre est magnifique, elle est étudiée au bac de français. Les taux d’intérêt montent quand même.", n:"Lettre à Bruxelles en alexandrins : « Du Racine budgétaire »"},
  {t:"Proposer de payer l’amende en fromage", e:{d:1,pop:2}, r:"Bruxelles accepte 40 tonnes de roquefort. Le commissaire néerlandais est hospitalisé.", n:"Amende payée en roquefort : la Commission évacuée"}
 ]},
{who:"all", src:"🔮 Futur possible", title:"La Tour Eiffel à vendre ?",
 text:"Bercy a fait l’inventaire des « actifs valorisables » de l’État. En tête de liste : un monument de 330 mètres.",
 options:[
  {t:"La vendre à un émirat pour 25 Md€", e:{d:-25,pop:-18,col:12}, r:"La Tour Eiffel est démontée et remontée dans le désert. Paris installe une grue à la place, pour faire illusion.", n:"Tour Eiffel vendue : les touristes photographient la grue"},
  {t:"La louer à un milliardaire de la tech qui la rebaptise « Tour X »", e:{d:-2,pop:-10,col:6}, r:"Un logo géant clignote au sommet. Les Parisiens tournent le dos en permanence.", n:"« Tour X » : les Parisiens refusent de lever les yeux"},
  {t:"La repeindre en or pour le prestige", e:{d:1.5,pop:-3}, r:"Elle brille tellement que les avions de Roissy changent de trajectoire.", n:"Tour Eiffel dorée : Air France modifie ses couloirs aériens"}
 ]},
{who:"all", src:"🔮 Futur imminent", title:"La baguette à 2 €",
 text:"Le prix de la baguette tradition franchit la barre symbolique des 2 €. Une émeute éclate dans une boulangerie de Clermont-Ferrand.",
 options:[
  {t:"Baguette subventionnée à 1 €", e:{def:0.5,pop:5,col:-4}, r:"Les Français achètent quatre baguettes par jour, juste pour le plaisir.", n:"Baguette à 1 € : record de consommation, les miettes partout"},
  {t:"Taxer la baguette pour financer la dette", e:{def:-0.3,pop:-14,col:14}, r:"La baguette à 2,60 €. La Révolution de 1789 a commencé pour moins que ça.", n:"Taxe baguette : les historiens rappellent l’affaire de 1789"},
  {t:"Lancer une baguette « Premium » à 4 € pour les ministres", e:{pop:-4,col:4}, r:"Elle est dorée à la feuille d’or. Personne ne veut la manger, tout le monde veut la jeter.", n:"Baguette Premium à 4 € : « Elle a un goût de mépris »"}
 ]},
{who:"all", src:"Remake de septembre 2025", title:"« Bloquons tout » : le retour",
 text:"Un appel anonyme sur les réseaux sociaux propose de « tout bloquer » le 10 du mois. Personne ne sait qui l’a lancé, mais tout le monde a déjà sorti son gilet.",
 options:[
  {t:"Attendre de voir ce qui se passe", e:{col:5}, manif:"bloquons", r:"Ce qui se passe, c’est que tout est bloqué.", n:"« Bloquons tout » : tout est bloqué, confirme la préfecture"},
  {t:"Annoncer des mesures sociales pour désamorcer", e:{def:2,pop:3,col:-12}, r:"Le mouvement se dégonfle. Les gilets retournent dans les coffres. Pour l’instant.", n:"Mesures sociales : le mouvement « Bloquons tout » se débloque"},
  {t:"Accuser les algorithmes et les influenceurs", e:{pop:-3,col:6}, manif:"bloquons", r:"Les influenceurs se sentent visés et rejoignent le mouvement. Avec leurs 40 millions d’abonnés.", n:"Les influenceurs rejoignent « Bloquons tout » en direct"}
 ]},
{who:"all", src:"Remake de 2019", title:"Vendre les bijoux de famille",
 text:"Bercy propose de privatiser quelques entreprises publiques pour renflouer les caisses. On a déjà essayé de vendre les autoroutes, ça s’est très bien passé (pour les acheteurs).",
 options:[
  {t:"Privatiser les Aéroports de Paris et la Française des Jeux", e:{d:-12,pop:-6,col:5}, r:"Les acheteurs font une affaire en or. L’État, une affaire en plomb.", n:"Privatisations : les acheteurs « remercient chaleureusement l’État »"},
  {t:"Privatiser les toilettes publiques", e:{d:-0.5,pop:-5}, r:"Le pipi passe à 2 €. Les Parisiens découvrent l’économie de marché.", n:"Toilettes privatisées : les arbres parisiens en danger"},
  {t:"Au contraire, nationaliser tout ce qui bouge", e:{d:30,pop:2,ass:-10}, r:"L’État rachète une chaîne de pizzerias, deux clubs de foot et un fabricant de trottinettes.", n:"L’État devient actionnaire d’une pizzeria de Montluçon"}
 ]},
{who:"all", src:"🔮 Futur possible", title:"Le nouvel avion présidentiel",
 text:"L’avion présidentiel a 17 ans. Il a une fuite dans les toilettes et le Wi-Fi ne marche qu’au-dessus de la Belgique.",
 options:[
  {t:"Commander un « Air Force Un » à 600 M€", e:{d:0.6,pop:-7}, r:"L’avion a un salon, une salle de sport et une salle de presse insonorisée, pour ne pas entendre les questions.", n:"Air Force Un : 600 millions et une salle anti-questions"},
  {t:"Voyager en low-cost avec bagage cabine", e:{pop:4}, r:"Vous payez 45 € de supplément pour la valise du chef du protocole. Les Français adorent. Mauvaise nouvelle.", n:"Le chef de l’État en low-cost : « Il a payé son siège au hublot »"},
  {t:"Un avion avec piscine, pour faire Brégançon en plein vol", e:{d:1,pop:-10}, r:"La piscine se vide au premier trou d’air sur la tête des passagers de la classe éco.", n:"Avion présidentiel à piscine : premier vol, première inondation"}
 ]},
{who:"all", src:"🔮 Futur possible", title:"L’IA dans l’administration",
 text:"Un cabinet de conseil (facturé 4 M€) recommande de remplacer une partie de l’administration par de l’intelligence artificielle.",
 options:[
  {t:"Remplacer 100 000 fonctionnaires par une IA", e:{d:8,def:-1,pop:-9,col:12}, manif:"fonctionnaires", r:"L’IA traite les dossiers en 3 secondes, tous refusés. Les fonctionnaires descendent dans la rue, avec le formulaire réglementaire.", n:"IA administrative : 100 % des dossiers refusés en un temps record"},
  {t:"Créer « ChatBleu-Blanc-Rouge » : 15 Md€", e:{d:15,pop:-2}, r:"L’IA nationale répond à toutes les questions : « Veuillez remplir le formulaire Cerfa n°12485*03. »", n:"ChatBleu-Blanc-Rouge : « Votre demande est irrecevable », répond l’IA"},
  {t:"Interdire l’IA aux ministres", e:{pop:2}, r:"Les ministres doivent écrire leurs discours eux-mêmes. Le niveau baisse, la sincérité monte.", n:"Interdits d’IA, les ministres découvrent la page blanche"}
 ]},
{who:"all", src:"🔮 Futur proche", title:"Les JO d’hiver 2030",
 text:"Les Alpes françaises accueillent les Jeux d’hiver en 2030. Problème : il n’y a plus beaucoup de neige. Et le budget fond plus vite que les glaciers.",
 options:[
  {t:"Garantir le budget, même s’il triple", e:{d:6,pop:-2}, r:"Le budget triple. Les organisateurs disent que c’est « dans la moyenne olympique ».", n:"JO 2030 : le budget triple, « c’est la tradition »"},
  {t:"Fabriquer de la neige artificielle sur toutes les Alpes", e:{d:3,pop:-6,col:3}, r:"Les canons à neige consomment autant qu’une petite ville. Les écologistes descendent en luge manifester.", n:"Neige artificielle : manifestation de lugeurs écolos à Chambéry"},
  {t:"Délocaliser les épreuves de ski à Dubaï", e:{d:1,pop:-8}, r:"Le slalom a lieu dans un centre commercial climatisé. Les Savoyards ne vous le pardonneront jamais.", n:"JO d’hiver : la descente se déroulera entre une boutique de montres et un McDo"}
 ]},
{who:"all", src:"Remake de 2018", title:"La Fête de la musique à l’Élysée",
 text:"Le 21 juin approche. Votre équipe propose d’ouvrir la cour de l’Élysée à un DJ électro très à la mode. Les photos risquent d’être… mémorables.",
 options:[
  {t:"Organiser une soirée électro géante dans la cour de l’Élysée", e:{d:0.4,pop:-6,col:4}, r:"Le DJ mixe jusqu’à 2 h du matin et vous dansez sur le perron. Les photos font le tour des réseaux. La moitié du pays trouve ça « gênant », l’autre moitié « très gênant ».", n:"Fête de la musique : le perron de l’Élysée transformé en boîte de nuit"},
  {t:"Monter sur scène et chanter vous-même (faux)", e:{pop:-8,col:3}, r:"Vous chantez « Douce France » avec deux tons d’écart. Les chiens du quartier hurlent à l’unisson.", n:"Le chef de l’État chante faux en direct : les chiens du 8e arrondissement en émoi"},
  {t:"Rester travailler au bureau avec des boules Quies", e:{pop:2}, r:"Vous travaillez toute la nuit. Les Français apprécient ce sérieux. Mauvais pour vous.", n:"Fête de la musique : le chef de l’État reste travailler, les Français attendris"}
 ]},
{who:"all", src:"Remake de 2020 et 2022", title:"Les vacances d’été à l’Élysée",
 text:"Le pays est en pleine crise (comme d’habitude). Votre agenda prévoit trois semaines de « travail à distance » au bord de la mer.",
 options:[
  {t:"Faire du jet-ski devant les photographes", e:{pop:-8,col:5}, r:"Vous faites des allers-retours en jet-ski pendant trois heures. Les paparazzis repartent avec 4 000 photos. Le pays repart avec une colère toute neuve.", n:"Jet-ski présidentiel : les photos de l’été font polémique"},
  {t:"Vacances au camping, « comme tout le monde »", e:{pop:4,col:-3}, r:"Vous dormez sous une tente au camping des Flots Bleus. Les voisins vous prêtent leur barbecue. Votre popularité remonte. Raté.", n:"Le chef de l’État au camping : « Il a ramené du rosé », raconte un voisin"},
  {t:"Croisière sur le yacht d’un milliardaire", e:{d:0.01,pop:-12,col:7}, r:"Le yacht fait 140 mètres, a deux piscines et un héliport. Vous postez une photo « simple et authentique ». Personne n’y croit.", n:"Croisière sur un méga-yacht : « une invitation privée », assure l’Élysée"}
 ]},
{who:"all", src:"Remake de 2022", title:"La grande finale",
 text:"L’équipe de France joue une finale à l’autre bout du monde. Le même soir, une star donne un concert géant à Paris. Vos conseillers débattent : où se montrer ?",

// Visage caricatural. mood : neutral, happy, smug, angry, shout, panic, cool
function face(ch, mood = "neutral", bust = true){
  const L = LOOK[ch]; let s = "";
  if(bust) s += `<rect width="120" height="120" fill="${L.bg}"/>`;
  if(L.hairBack) s += `<path d="${L.hairBack}" fill="${L.hair}"/>`;
  if(bust){
    s += `<path d="M6 124 C10 94 34 85 60 85 C86 85 110 94 114 124Z" fill="${L.suit}"/>`;
    s += L.tie ? `<path d="M48 85 L60 106 L72 85Z" fill="#fff"/><path d="M57 88 L63 88 L65.5 110 L60 117 L54.5 110Z" fill="${L.tie}"/>`
               : `<path d="M49 85 L60 101 L71 85Z" fill="#fff"/><circle cx="60" cy="96" r="2.5" fill="#e9c46a"/>`;
  }
  s += `<rect x="52" y="68" width="16" height="20" fill="${SKIN_D}"/>`;
  s += `<ellipse cx="${60-L.rx}" cy="54" rx="6" ry="9" fill="${SKIN_D}"/><ellipse cx="${60+L.rx}" cy="54" rx="6" ry="9" fill="${SKIN_D}"/>`;
  s += `<ellipse cx="60" cy="50" rx="${L.rx}" ry="30" fill="${SKIN}"/>`;
  s += `<path d="${L.hairTop}" fill="${L.hair}"/>`;
  const B = {neutral:["M44 42 Q50 39 56 42","M64 42 Q70 39 76 42"], happy:["M44 40 Q50 34 56 40","M64 40 Q70 34 76 40"], angry:["M43 38 L56 44","M77 38 L64 44"], panic:["M44 38 Q50 31 56 35","M64 35 Q70 31 76 38"], smug:["M44 42 Q50 40 56 42","M64 39 Q70 33 76 37"]};
  const b = B[{shout:"angry", cool:"smug"}[mood] || mood] || B.neutral;
  s += b.map(d => `<path d="${d}" stroke="${L.brow}" stroke-width="${L.bw}" fill="none" stroke-linecap="round"/>`).join("");
  if(mood === "cool"){
    s += `<rect x="40" y="44" width="17" height="11" rx="4" fill="#111"/><rect x="63" y="44" width="17" height="11" rx="4" fill="#111"/><rect x="56" y="47" width="8" height="2.5" fill="#111"/><rect x="43" y="46" width="5" height="2" fill="#fff" opacity=".5"/>`;
  } else if(mood === "happy"){
    s += `<path d="M45 51 Q50 46 55 51" stroke="#3a2a20" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M65 51 Q70 46 75 51" stroke="#3a2a20" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  } else {
    const big = mood === "panic", ry = big ? 6 : (mood === "angry" || mood === "shout") ? 3.2 : 4.2, rx = big ? 6 : 5, pr = big ? 1.8 : 2.6, off = mood === "smug" ? 1.5 : 0;
    [50,70].forEach(x => s += `<ellipse cx="${x}" cy="50" rx="${rx}" ry="${ry}" fill="#fff"/><circle cx="${x+off}" cy="50.5" r="${pr}" fill="${L.iris}"/><circle cx="${x+off}" cy="50.5" r="${pr*.45}" fill="#111"/>`);
  }
  s += `<path d="M60 52 Q55.5 61 61 62" stroke="#c58f6d" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const lip = L.lips || "#8a3e30";
  const M = {
    neutral:`<path d="M51 68 Q60 72 69 68" stroke="${lip}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    smug:`<path d="M51 69 Q61 72 70 63" stroke="${lip}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    happy:`<path d="M47 64 Q60 81 73 64Z" fill="#7a1f1f"/><path d="M49 65 Q60 69 71 65 L70.5 67.5 Q60 71 49.5 67.5Z" fill="#fff"/>`,
    angry:`<ellipse cx="60" cy="70" rx="9" ry="5.5" fill="#5a1010"/><rect x="53" y="65.5" width="14" height="3" rx="1" fill="#fff"/>`,
    shout:`<ellipse cx="60" cy="71" rx="11" ry="10" fill="#5a1010"/><rect x="52" y="62" width="16" height="4" rx="2" fill="#fff"/><ellipse cx="60" cy="76" rx="6" ry="3" fill="#d4575a"/>`,
    panic:`<ellipse cx="60" cy="71" rx="5" ry="7" fill="#5a1010"/>`
  };
  s += M[mood] || (mood === "cool" ? M.smug : M.neutral);
  if(mood === "happy") s += `<circle cx="44" cy="61" r="5" fill="#f28b82" opacity=".45"/><circle cx="76" cy="61" r="5" fill="#f28b82" opacity=".45"/>`;
  if(mood === "panic") s += `<path d="M84 28 Q89 37 84 41 Q79 37 84 28Z" fill="#7cc4ff"/>`;
  if(mood === "shout") s += `<path d="M88 64 L100 60 M89 70 L102 71 M88 76 L99 82" stroke="#d42a2f" stroke-width="2.5" stroke-linecap="round"/>`;
  if(bust && ch === "lepen") s += `<g transform="translate(14 82)"><path d="M0 12 L4 0 L10 8 L16 8 L22 0 L26 12Z" fill="#e8913a"/><circle cx="13" cy="17" r="11" fill="#e8913a"/><circle cx="9" cy="16" r="1.7" fill="#222"/><circle cx="17" cy="16" r="1.7" fill="#222"/><path d="M11 21 Q13 23 15 21" stroke="#222" fill="none" stroke-width="1.2"/></g>`;
  return s;
}
function faceSVG(ch, mood, size){ return `<svg class="face" width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true">${face(ch, mood, true)}</svg>`; }

function city(base, col, win, night){
  let x = -10, s = "", k = 3;
  while(x < 650){
    const w = 58 + (k * 37 % 41), h = 64 + (k * 53 % 86); k++;
    s += `<rect x="${x}" y="${base-h}" width="${w}" height="${h}" fill="${col}"/><rect x="${x-3}" y="${base-h-8}" width="${w+6}" height="9" fill="${col}" opacity=".85"/>`;

      s += `<rect x="${wx}" y="${wy}" width="7" height="10" fill="${lit ? "#ffd36b" : win}"/>`;
    }

function beep(f, t, dur, type = "sine", vol = .05, f2 = null){

  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t0 = a.currentTime + t;

  src.connect(f).connect(g).connect(a.destination); src.start(t0);
}

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const nf0 = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtEur = md => nf0.format(Math.floor(md*1e9)) + " €";
const fmtMd = md => (Math.abs(md) >= 10 ? nf0.format(md) : nf1.format(md)) + " Md€";
const sgn = (v,f) => (v>0?"+":v<0?"−":"") + f(Math.abs(v));
const yearOf = i => 2027 + Math.floor((i+1)/4);
const seasonOf = i => SEASONS[(1+i)%4];
const dateOf = i => seasonOf(i) + " " + yearOf(i);
const ratingIdx = r => RATINGS.findIndex(x => r < x[0]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S = null;
function ratio(){ return S.dette / S.pib * 100; }
function taux(){ return RATINGS[ratingIdx(ratio())][2]; }
function note(){ return RATINGS[ratingIdx(ratio())][1]; }
function interestQ(){ return S.dette * taux() / 100 / 4; }
function deficitYear(){ return (S.defPrim + interestQ()) * 4; }
function ag(m,f){ return CHARS[S.char].g === "f" ? f : m; }

function snap(){ return {dette:S.dette, ratio:ratio(), pop:S.pop, col:S.col, ass:S.ass, note:note(), ri:ratingIdx(ratio()), defY:deficitYear()}; }

/* ---------------------------------------------------------------------
   Moteur
   --------------------------------------------------------------------- */
function newGame(charKey){
  const c = CHARS[charKey];
  S = {char:charKey, turn:0, dette:DETTE0, pib:PIB0, defPrim:24, pop:c.pop, col:c.col, ass:c.ass,
       pms:0, pmName:c.pm, pmDays:0, jokers:3, flag493:false, hist:[], log:[], news:[], acte:312,
       lastManif:-9, busy:false, over:false, started:true, hints:loadPref("hints", true), sound:loadPref("sound", true)};
  S.hist.push({ratio:ratio(), pop:S.pop});
  S.deck = buildDeck(charKey);
  S.news = ["Passation de pouvoir à l’Élysée : le nouveau locataire demande où sont rangées les cartes bleues de l’État",
            "Dette publique : " + nf0.format(DETTE0) + " milliards d’euros, et ce n’est que le début",
            "Les agences de notation « observent avec intérêt » l’arrivée de " + c.name];
  updateTicker();
  pushLog("Mai 2027", "Investiture de " + c.name + ". Le compteur de la dette tourne déjà.");
  renderGame();
}

function buildDeck(charKey){
  const own = shuffle(CARDS.filter(c => c.who === charKey && !c.first));
  const shared = shuffle(CARDS.filter(c => c.who === "all"));
  const first = CARDS.find(c => c.who === charKey && c.first);
  const deck = []; let flip = false;
  for(let i=0;i<TURNS;i++){
    if(seasonOf(i) === "Automne"){ deck.push(budgetCard(i)); continue; }
    if(i === 0){ deck.push(first); continue; }
    flip = !flip;
    deck.push((flip ? shared.pop() : own.pop()) || shared.pop() || own.pop());
  }
  return deck;
}

function applyE(e){
  if(!e) return;
  const c = S.char;
  let d = e.d || 0; if(c === "macron" && d > 0) d *= 1.1;
  S.dette += d;
  S.defPrim += e.def || 0;
  let p = e.pop || 0; if(c === "lepen" && p < 0) p *= 0.85;
  S.pop = clamp(S.pop + p, 0, 100);
  let k = e.col || 0; if(c === "melenchon" && k > 0) k *= 1.25;
  S.col = clamp(S.col + k, 0, 100);
  if(e.assSet != null) S.ass = e.assSet;
  let a = e.ass || 0; if(a < 0 && S.flag493) a = 0;
  S.ass = clamp(S.ass + a, 0, 100);
}

function endQuarter(){
  const interest = interestQ(), t = taux();
  const deficit = S.defPrim + interest;
  S.dette += deficit;
  // croissance : plombée par la colère et par des taux d'intérêt qui étranglent l'économie
  S.pib *= 1 + (0.0065 - S.col * 0.00008 - Math.max(0, ratio() - 140) * 0.00005);
  S.pop = clamp(S.pop + (32 - S.pop) * 0.05, 0, 100);   // les Français oublient (un peu)
  S.col = clamp(S.col - 3, 0, 100);                      // la colère retombe (un peu)
  S.ass = clamp(S.ass + 3, 0, 100);                      // l'Assemblée se calme (un peu)
  S.pmDays += 91;
  S.hist.push({ratio:ratio(), pop:S.pop});
  return {interest, deficit, primary:S.defPrim, taux:t};
}

function hintChips(o){
  const e = o.e || {}, rem = TURNS - S.turn, out = [];
  const debt = (e.d||0) + (e.def||0) * rem;
  if(debt >= 100) out.push(["💸💸💸 dette","good"]); else if(debt >= 25) out.push(["💸💸 dette","good"]); else if(debt >= 1.5) out.push(["💸 dette","good"]); else if(debt <= -1.5) out.push(["🪙 économies","bad"]);
  const p = e.pop || 0;
  if(p <= -10) out.push(["👎👎 impopulaire","good"]); else if(p < 0) out.push(["👎 impopulaire","good"]); else if(p >= 6) out.push(["👍👍 populaire","bad"]); else if(p > 0) out.push(["👍 populaire","bad"]);
  if((e.col||0) >= 10) out.push(["🔥 colère","good"]); else if((e.col||0) <= -8) out.push(["🧊 apaisement","bad"]);
  if((e.ass||0) <= -15 || (e.assSet!=null && e.assSet < 30)) out.push(["🏛️ chaos","good"]);
  if(o.manif) out.push(["📢 manif","neu"]);
  if(o.alt) out.push(["🎲 risqué","neu"]);
  if(!out.length) out.push(["≈ pas grand-chose","neu"]);
  return out.map(([t,c]) => `<span class="hint ${c}">${t}</span>`).join("");
}

function pushLog(d, t){ S.log.push({d, t}); }
function addNews(t){ if(!t) return; S.news.unshift(t); S.news = S.news.slice(0, 8); updateTicker(); }
function updateTicker(){
  const run = $("#tickrun"); if(!run || !S) return;
  run.innerHTML = S.news.map(n => `<span>${esc(n)}</span>`).join("");
  run.style.setProperty("--dur", Math.max(35, S.news.join(" ").length * 0.16) + "s");

}

/* ---------------------------------------------------------------------
   Décisions
   --------------------------------------------------------------------- */
function choose(i){
  if(S.busy || S.over) return;
  S.busy = true;
  const card = S.card, o = card.options[i];
  let e = o.e, r = o.r, n = o.n;
  if(o.alt && Math.random() < o.alt.p){ e = o.alt.e; r = o.alt.r; n = o.alt.n || n; }
  const before = snap();
  applyE(e);
  S.flag493 = false;
  const eco = endQuarter();
  let ev = null;
  if(Math.random() < 0.45){ ev = pick(NEWS); applyE(ev.e); addNews(ev.t); }
  addNews(n);
  pushLog(dateOf(S.turn), n || card.title);
  let manif = o.manif || null;
  if(!manif && o.manifChance && Math.random() < o.manifChance) manif = o.manifType;
  S.pendingManif = manif;
  const after = snap(), sc = sceneFor(card, i);
  showResult({kicker:"Décision · " + dateOf(S.turn), title:o.t, text:r, before, after, eco, ev, scene:[sc, sceneOpts(sc, card, i, before, after, n)], onContinue:postTurn});
}

function useJoker(){
  if(S.busy || S.over || S.jokers <= 0 || S.flag493) return;
  S.busy = true;
  const j = CHARS[S.char].joker, before = snap();
  S.jokers--;
  applyE(j.e);
  if(S.char === "macron") S.flag493 = true;
  addNews(j.toast.replace(/^\S+\s/, ""));
  pushLog(dateOf(S.turn), "Joker : " + j.name);
  const scene = {
    macron:["assembly",{sign:"49.3 !", caption:"Le 49.3 est dégainé : débat terminé"}],
    melenchon:["tv",{mood:"shout", caption:"« La République, c’est moi ! »"}],
    lepen:["money",{mood:"angry", sign:"AMENDE : 15 Md€", caption:"Bruxelles inflige une amende pour insolence"}]
  }[S.char];
  showResult({kicker:"Joker · " + dateOf(S.turn), title:j.icon + " " + j.name, text:j.toast.replace(/^\S+\s/, ""), before, after:snap(), scene, mood:S.char === "melenchon" ? "shout" : "smug",
    onContinue:() => {
      closeModal();
      if(checkEnd()) return;
      if(S.ass <= 0) return showCensure(() => { closeModal(); S.busy = false; renderGame(); });
      S.busy = false; renderGame();
    }});
}

function postTurn(){
  closeModal();
  if(checkEnd()) return;
  if(S.ass <= 0) return showCensure(afterCensure);
  afterCensure();
}
function afterCensure(){
  closeModal();
  if(checkEnd()) return;
  let m = S.pendingManif; S.pendingManif = null;
  if(!m && S.turn - S.lastManif >= 2 && Math.random() < Math.min(0.6, (S.col - 30) / 90)) m = pick(RANDOM_MANIFS);
  if(m){ S.lastManif = S.turn; return showManif(m, finishTurn); }
  finishTurn();
}
function finishTurn(){
  closeModal();
  if(checkEnd()) return;
  S.turn++;
  if(S.turn >= TURNS) return endGame("term");
  S.busy = false;
  renderGame();
  window.scrollTo({top:0, behavior:"smooth"});
}

function checkEnd(){
  const r = ratio();
  if(r >= WIN_RATIO && S.pop <= WIN_POP){ endGame("win"); return true; }
  if(S.col >= 100){ endGame("revolution"); return true; }
  if(S.pop >= 65){ endGame("adored"); return true; }
  if(r < 100){ endGame("austerity"); return true; }
  return false;
}
